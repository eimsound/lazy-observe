[project]
name = "lazy-observe-docs"
version = "0.0.0"
description = "Documentation site build tooling for lazy-observe."
requires-python = ">=3.13"
dependencies = [
    "zensical==0.1.1",
]

[tool.uv]
package = false
# 最小发布年龄 7 天，与 scripts/release-age.env 的 MIN_RELEASE_AGE_DAYS 保持一致；
# uv 解析文档构建工具依赖时只取发布满 7 天的版本。
exclude-newer = "7 days"
