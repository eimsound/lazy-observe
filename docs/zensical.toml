[project]
site_name = "lazy-observe"
site_description = "Self-hosted, single-binary full-stack observability platform built on VictoriaMetrics, VictoriaLogs, and VictoriaTraces."
site_url = "https://eimsound.github.io/lazy-observe/"
repo_url = "https://github.com/eimsound/lazy-observe"
repo_name = "eimsound/lazy-observe"
docs_dir = "."
exclude_docs = """
zh/**
.venv/**
.cache/**
site/**
pyproject.toml
uv.lock
zensical*.toml
"""
# Zensical 0.1.1 requires site_dir to stay within the config directory (docs/),
# while permitting site_dir inside docs_dir when docs_dir == project_root (".").
# `mise run docs-build` stages docs/site to repo-root site/ after both builds.
site_dir = "site"

nav = [
  { "Overview" = "index.md" },
  { "Quickstart" = "quickstart.md" },
  { "Deployment and operations" = [
    { "Deployment" = "deployment.md" },
    { "Operations" = "operations.md" },
    { "Grafana and Perses" = "grafana-perses.md" },
  ] },
  { "Client SDKs" = [
    { "Go" = "sdk/go.md" },
    { "Node.js" = "sdk/node.md" },
    { "Browser and React" = "sdk/browser.md" },
    { "Python" = "sdk/python.md" },
  ] },
  { "Reference" = [
    { "Platform comparison" = "comparison.md" },
    { "Version compatibility matrix" = "version-matrix.md" },
  ] },
]

[project.theme]
variant = "modern"
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.alternate]]
name = "English"
link = "/lazy-observe/"
lang = "en"

[[project.extra.alternate]]
name = "简体中文"
link = "/lazy-observe/zh/"
lang = "zh"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
