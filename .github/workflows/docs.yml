name: Docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "zensical*.toml"
      - "tools/docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  MISE_GITHUB_TOKEN: ${{ github.token }}

jobs:
  deploy:
    name: Build and deploy docs site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Calculate cache keys
        id: cache-keys
        run: bash scripts/ci-cache-keys.sh
      - name: Restore mise cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-base-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.mise }}
          restore-keys: mise-base-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore uv cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-docs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/docs/pyproject.toml') }}
          restore-keys: uv-docs-${{ runner.os }}-${{ runner.arch }}-
      - name: Install mise toolchain
        run: bash scripts/ci-setup-mise.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_CI_TOOLS: uv
      - name: Build bilingual docs site
        run: mise run --skip-tools docs-build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
