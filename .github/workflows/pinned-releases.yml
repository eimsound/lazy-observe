name: Pinned releases

# 每周追踪 Dependabot 管不到的手工固定点（Victoria 存储二进制与 e2e 集群镜像、mise、Trivy）有没有新版本：
# scripts/check-pinned-releases.sh --report 列出当前版本与「已满最小发布年龄的最新稳定版」，
# 有 outdated（或固定点太新）时 job 变红，并在一个固定标题的 issue 里记录清单。
# 这些固定点落后时 Dependabot 不会提醒，Victoria 曾因此落后好几个版本、镜像扫描出了一批 HIGH CVE。
#
# issue 的处理：标题固定，已有未关闭的就更新正文，没有才新建，所以不会重复开；全部追平后自动关闭。
# 只有这个 job 持有 issues: write，其余 workflow 都不要这个权限。
# PR 里的年龄门禁在 ci.yml 的 pinned-releases job（--gate）。
on:
  schedule:
    # 周一 02:00 UTC（北京时间 10:00），晚于 Dependabot 的周一 03:00（Asia/Shanghai）。
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pinned-releases
  cancel-in-progress: false

jobs:
  report:
    name: Pinned releases report
    # fork 里没有这个 issue 可维护，也不该消耗它们的 Actions 配额。
    if: github.repository == 'eimsound/lazy-observe'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_TITLE: 手工固定点有新版本可升级（pinned-releases）
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report pinned releases
        id: report
        run: |
          # 退出码 0 全部最新；1 有 outdated/too-new；2 脚本自身出错（网络、限流、解析）。
          status=0
          bash scripts/check-pinned-releases.sh --report --markdown "$RUNNER_TEMP/pinned-releases.md" || status=$?
          printf 'status=%s\n' "$status" >>"$GITHUB_OUTPUT"
          if [[ -f $RUNNER_TEMP/pinned-releases.md ]]; then
            cat "$RUNNER_TEMP/pinned-releases.md" >>"$GITHUB_STEP_SUMMARY"
          fi
      - name: Sync tracking issue
        # 只在拿到有效报告（0 或 1）时同步；脚本出错（2）时没有可信的清单，不改动 issue，由最后一步让 job 变红。
        if: steps.report.outputs.status == '0' || steps.report.outputs.status == '1'
        env:
          STATUS: ${{ steps.report.outputs.status }}
        run: |
          # 不走搜索 API（索引有延迟，刚建的 issue 搜不到会重复开）：列出最近的未关闭 issue，按标题精确匹配。
          number=$(gh issue list --state open --limit 200 --json number,title \
            --jq "map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty")
          if [[ $STATUS == 1 ]]; then
            body="$RUNNER_TEMP/issue-body.md"
            {
              cat "$RUNNER_TEMP/pinned-releases.md"
              printf '\n---\n由 `.github/workflows/pinned-releases.yml` 每周自动更新（运行：%s/%s/actions/runs/%s）。' \
                "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
              printf '全部追平后会自动关闭。\n'
            } >"$body"
            if [[ -n $number ]]; then
              gh issue edit "$number" --body-file "$body"
            else
              gh issue create --title "$ISSUE_TITLE" --body-file "$body"
            fi
          elif [[ -n $number ]]; then
            gh issue close "$number" --comment "所有手工固定点都已是满最小发布年龄的最新稳定版，自动关闭。"
          fi
      - name: Fail when pins are outdated or the check errored
        if: steps.report.outputs.status != '0'
        env:
          STATUS: ${{ steps.report.outputs.status }}
        run: |
          printf 'pinned releases check exited with %s (1 = outdated or too new pins, 2 = check error)\n' "$STATUS" >&2
          exit 1
