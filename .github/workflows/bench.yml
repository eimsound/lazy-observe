name: Performance gates

# 性能门禁不跟 PR 跑；除手动触发外，每周在 main 上定时运行一次以持续守护回读/总 RSS/p99 回归，
# 发版前另由 release.yml 的 performance-gates job 挡住，两处步骤由 scripts/check-e2e-contract.sh 保证一致。
# GitHub 托管 runner 是共享机器，噪声比自建 runner 大；结果只作参考时注意这一点。
on:
  workflow_dispatch:
  schedule:
    # 每周日 UTC 17:00（北京时间周一 01:00），避开工作高峰与 Renovate（北京时间周一 03:00 起）高峰。
    - cron: "0 17 * * 0"

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: false

# mise 在 job 中途按需安装 task 工具时也要带 token，否则 GitHub API 匿名限流会让安装 403。
env:
  MISE_GITHUB_TOKEN: ${{ github.token }}

jobs:
  bench:
    name: Ingest, release, query, and HA gates
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Docker access
        run: bash scripts/ci-setup-docker.sh
      - name: Calculate cache keys
        id: cache-keys
        run: bash scripts/ci-cache-keys.sh
      # mise、gomod、gobuild、pnpm 只读 ci.yml 在 main 上保存的缓存（perf-gates 的工具集与 base 相同）；
      # 只有 storage-all 由这里在 main 上保存。缓存规矩见 ci.yml 顶部注释。
      - name: Restore mise cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-base-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.mise }}
          restore-keys: mise-base-${{ runner.os }}-${{ runner.arch }}-
      - name: Install mise toolchain
        run: bash scripts/ci-setup-mise.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_CI_PROFILE: perf-gates
      - name: Restore Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ steps.cache-keys.outputs.go }}
          restore-keys: gomod-
      - name: Restore Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: gobuild-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.go-toolchain }}-${{ steps.cache-keys.outputs.go }}
          restore-keys: gobuild-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.go-toolchain }}-
      - name: Restore pnpm cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: pnpm-web-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.pnpm-web }}
          restore-keys: pnpm-web-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore cross-platform storage archives
        id: storage-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/storage-bin/.archives
            .cache/storage-bin/*/.archives
          key: storage-all-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.storage }}
          restore-keys: storage-all-${{ runner.os }}-${{ runner.arch }}-
      - name: Run 30 second ingest benchmark and relative gate
        run: BENCH_DURATION=30s BENCH_BASELINE=bench/baseline.json BENCH_OUTPUT=bench/results/ingest.json mise run bench
      - name: Gate Linux release artifacts and zero-config startup
        run: mise run perf-release
      - name: Gate exact query latency and capacity-controlled weak scaling
        run: mise run perf-ha
      - name: Validate performance result contract
        run: mise run perf-results-check
      - name: Save cross-platform storage archives
        if: github.ref == 'refs/heads/main' && steps.storage-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/storage-bin/.archives
            .cache/storage-bin/*/.archives
          key: ${{ steps.storage-cache.outputs.cache-primary-key }}
