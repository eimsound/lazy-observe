name: Release

# 服务端发版：v* tag 发布 GitHub Release 与 ghcr.io 镜像；workflow_dispatch 只出 snapshot
# 归档（不发布任何东西）。全部跑在 GitHub 托管 runner 上，凭据只用 job 的 GITHUB_TOKEN。
# SDK 由 sdk-release.yml 按 sdk/go/v*、sdk-*-v* tag 单独发布。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# mise 在 job 中途按需安装 task 工具时也要带 token，否则 GitHub API 匿名限流会让安装 403。
env:
  MISE_GITHUB_TOKEN: ${{ github.token }}

jobs:
  container-check:
    name: Container smoke (linux/${{ matrix.arch }})
    # 原生 runner 构建与冒烟，不走 QEMU 仿真。
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Docker access
        run: bash scripts/ci-setup-docker.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # 不用默认的 moby/buildkit:buildx-stable-1：按具体版本 + 多架构 index digest 固定。
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - name: Set build metadata
        id: build-meta
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          version=dev
          if [[ "$RELEASE_EVENT" == push ]]; then version=${RELEASE_REF_NAME#v}; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build loadable container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: lazy-observe:preflight-${{ matrix.arch }}
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ steps.build-meta.outputs.version }}
            COMMIT=${{ steps.build-meta.outputs.commit }}
            DATE=${{ steps.build-meta.outputs.date }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=container-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.arch }}
      # 发版前挡住：CRITICAL/HIGH 且已有修复版本的漏洞让 container-check 失败，archive 与 docker 都不会运行。
      # 扫描器按版本 + sha256 固定，例外写进 .trivyignore.yaml（见 scripts/check-image-vulns.sh）。
      - name: Scan container for fixable CRITICAL/HIGH vulnerabilities
        run: bash scripts/check-image-vulns.sh lazy-observe:preflight-${{ matrix.arch }}
      - name: Smoke container
        run: bash scripts/check-container-smoke.sh lazy-observe:preflight-${{ matrix.arch }} linux/${{ matrix.arch }}

  # 嵌入的 Victoria 二进制在 lazy-observe 里是 gzip 后 go:embed 的 payload，镜像与归档里没有独立的可执行文件，
  # 上面的镜像扫描读不到它们的 Go buildinfo。这里对下载并校验过 sha256 的原始上游二进制（amd64 + arm64，
  # Trivy 只读静态 buildinfo，一台 runner 即可）跑 trivy rootfs：参数与镜像扫描一致，例外共用 .trivyignore.yaml。
  # 嵌入的是上游官方二进制、不自行编译（ADR 0016），所以命中只警告（::warning:: 注解 + step summary），不阻塞发版。
  # 但扫描没跑成（Trivy 出错、没有恰好识别出四个 Go 二进制、报告与退出码对不上）时本 job 失败；archive 依赖本 job，
  # 失败会挡住出包。细节见 scripts/check-storage-bin-vulns.sh。
  storage-bin-scan:
    name: Embedded storage binary vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan embedded Victoria binaries for fixable CRITICAL/HIGH vulnerabilities (warn only)
        run: bash scripts/check-storage-bin-vulns.sh

  # 性能门禁不跟 PR 跑，改为挡在发版链路上：tag 发布和手动 snapshot 都必须先过这一关。
  # 步骤与 bench.yml（手动入口）一致，由 scripts/check-e2e-contract.sh 校验。
  performance-gates:
    name: Ingest, release, query, and HA gates
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Docker access
        run: bash scripts/ci-setup-docker.sh
      - name: Calculate cache keys
        id: cache-keys
        run: bash scripts/ci-cache-keys.sh
      - name: Restore mise cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-performance-gates-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}
          restore-keys: mise-performance-gates-${{ runner.os }}-${{ runner.arch }}-
      - name: Install mise toolchain
        run: bash scripts/ci-setup-mise.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_CI_PROFILE: perf-gates
      - name: Restore Go cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-bench-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.mise }}-${{ steps.cache-keys.outputs.go }}
          restore-keys: |
            go-bench-${{ runner.os }}-${{ runner.arch }}-
            go-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.mise }}-${{ steps.cache-keys.outputs.go }}
            go-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: pnpm-web-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.mise }}-${{ steps.cache-keys.outputs.pnpm-web }}
          restore-keys: pnpm-web-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/storage-bin/.archives
            .cache/storage-bin/*/.archives
          key: storage-all-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.storage }}
          restore-keys: storage-all-${{ runner.os }}-${{ runner.arch }}-
      - name: Run 30 second ingest benchmark and relative gate
        run: BENCH_DURATION=30s BENCH_BASELINE=bench/baseline.json BENCH_OUTPUT=bench/results/ingest.json mise run bench
      - name: Gate Linux release artifacts and zero-config startup
        run: mise run perf-release
      - name: Gate exact query latency and capacity-controlled weak scaling
        run: mise run perf-ha
      - name: Validate performance result contract
        run: mise run perf-results-check

  archive:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Snapshot archives' || 'Publish archives' }}
    needs: [container-check, storage-bin-scan, performance-gates]
    runs-on: ubuntu-24.04
    permissions:
      # GoReleaser creates the GitHub Release and uploads archives.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Calculate cache keys
        id: cache-keys
        run: bash scripts/ci-cache-keys.sh
      - name: Restore release mise cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.mise }}
          restore-keys: mise-release-${{ runner.os }}-${{ runner.arch }}-
      - name: Install release toolchain
        run: bash scripts/ci-setup-mise.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISE_CI_PROFILE: release
      - name: Restore release Go cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.mise }}-${{ steps.cache-keys.outputs.go }}
          restore-keys: go-release-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore release pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: pnpm-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.mise }}-${{ steps.cache-keys.outputs.pnpm-web }}
          restore-keys: pnpm-release-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore cross-platform storage archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/storage-bin/.archives
            .cache/storage-bin/*/.archives
          key: storage-all-${{ steps.cache-keys.outputs.storage }}
          restore-keys: storage-all-
      - name: Validate snapshot configuration
        if: github.event_name == 'workflow_dispatch'
        run: mise run release-snapshot-check
      - name: Build snapshot archives
        if: github.event_name == 'workflow_dispatch'
        run: mise run snapshot
      - name: Upload snapshot archives
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-snapshot
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          if-no-files-found: error
      - name: Validate publish prerequisites
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || {
            echo 'release tag commit is not reachable from main' >&2
            exit 1
          }
          mise run release-publish-check
      - name: Publish GoReleaser archives
        if: github.event_name == 'push'
        run: mise run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Publish multi-platform container
    if: github.event_name == 'push'
    needs: archive
    runs-on: ubuntu-24.04
    permissions:
      # 只读：这个 job 把 GITHUB_TOKEN 当作 BuildKit secret 挂进构建，构建期代码不应该拿到
      # 写仓库的权限。回填 Release 资产交给下面的 helm-values job。
      contents: read
      packages: write
    # digest 只有推完镜像才存在；helm-values job 通过 outputs 拿到它和版本号。
    outputs:
      version: ${{ steps.build-meta.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The builder stage runs on $BUILDPLATFORM and cross-compiles; the final
      # distroless stage only copies files, so arm64 needs no QEMU emulation.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # 不用默认的 moby/buildkit:buildx-stable-1：按具体版本 + 多架构 index digest 固定。
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/eimsound/lazy-observe
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Set build metadata
        id: build-meta
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          echo "version=${RELEASE_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build and push container
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.build-meta.outputs.version }}
            COMMIT=${{ steps.build-meta.outputs.commit }}
            DATE=${{ steps.build-meta.outputs.date }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: |
            type=gha,scope=container-amd64
            type=gha,scope=container-arm64
          cache-to: type=gha,mode=max,scope=container-release
      - name: Verify pushed manifest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker buildx imagetools inspect "ghcr.io/eimsound/lazy-observe@$DIGEST"

  # chart 本身不打包也不发布（仍在 deploy/helm/lazy-observe）；digest 只有推完镜像才存在，
  # 且 GoReleaser 已在 archive job 建好 Release，所以回填的做法是把 digest 写成 values
  # 片段挂到本次 Release 上，而不是把 digest 提交回 main（AFK 契约禁止直推 main，
  # 提交回 main 也只会让 chart 永远指向上一个版本的镜像）。
  # 单独开一个 job 而不是塞进 docker：那个 job 会把 GITHUB_TOKEN 当 BuildKit secret 挂进
  # 构建，写权限只应该出现在这里。
  helm-values:
    name: Attach digest-pinned Helm values
    if: github.event_name == 'push'
    needs: docker
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # 生成脚本在仓库里（scripts/render-helm-release-values.sh），所以要 checkout。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Render digest-pinned Helm values
        env:
          IMAGE_DIGEST: ${{ needs.docker.outputs.digest }}
          IMAGE_TAG: ${{ needs.docker.outputs.version }}
        run: |
          bash scripts/render-helm-release-values.sh \
            --repository ghcr.io/eimsound/lazy-observe \
            --tag "$IMAGE_TAG" \
            --digest "$IMAGE_DIGEST" \
            --output "dist/helm-values-lazy-observe-$IMAGE_TAG.yaml"
      - name: Attach digest-pinned Helm values to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          HELM_VALUES_FILE: dist/helm-values-lazy-observe-${{ needs.docker.outputs.version }}.yaml
        run: gh release upload "$RELEASE_TAG" "$HELM_VALUES_FILE" --repo "$GITHUB_REPOSITORY" --clobber
