name: Release

# 服务端发版：v* tag 发布 GitHub Release 与 ghcr.io 镜像；workflow_dispatch 只出 snapshot
# 归档（不发布任何东西）。全部跑在 GitHub 托管 runner 上，凭据只用 job 的 GITHUB_TOKEN。
# 不可变容器发布流：build-meta 锁定单一构建元信息 → container-check（仅 contents: read）单次构建
# OCI 归档、对同一字节做 Trivy 扫描与容器冒烟 → archive（GoReleaser 先建 draft Release 并签发归档
# provenance）→ docker（无 Dockerfile 构建，推送已扫描 OCI 字节并组装多架构 index、Cosign keyless
# 签名、Provenance/SBOM Attestation）→ helm-values（回填同一 digest）→ publish-release（公开 Release）。
# SDK 由 sdk-release.yml 按 sdk/go/v*、sdk-*-v* tag 单独发布。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# mise 在 job 中途按需安装 task 工具时也要带 token，否则 GitHub API 匿名限流会让安装 403。
env:
  MISE_GITHUB_TOKEN: ${{ github.token }}

jobs:
  # 同一 release 锁定单一 VERSION / COMMIT / DATE，避免 amd64/arm64 矩阵或下游阶段因时间戳漂移导致重建。
  build-meta:
    name: Prepare release metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
      date: ${{ steps.meta.outputs.date }}
    steps:
      - name: Set build metadata
        id: meta
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          version=dev
          if [[ "$RELEASE_EVENT" == push ]]; then version=${RELEASE_REF_NAME#v}; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  container-check:
    name: Container build, scan, and smoke (linux/${{ matrix.arch }})
    needs: build-meta
    # 原生 runner 构建与冒烟，不走 QEMU 仿真；仅继承顶层 contents: read，绝不向 BuildKit 暴露写权限。
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Docker access
        run: bash scripts/ci-setup-docker.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # 不用默认的 moby/buildkit:buildx-stable-1：按具体版本 + 多架构 index digest 固定。
          driver-opts: image=moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb
      - name: Generate OCI image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/eimsound/lazy-observe
          labels: |
            org.opencontainers.image.created=${{ needs.build-meta.outputs.date }}
            org.opencontainers.image.version=${{ needs.build-meta.outputs.version }}
            org.opencontainers.image.revision=${{ needs.build-meta.outputs.commit }}
      # 不向共享 10 GB Actions 缓存写 BuildKit 层：原生冷构约 ~90s 且与约 ~15m 的
      # performance-gates 并行，与 ci.yml 的 artifact-smoke 保持一致。
      - name: Build immutable OCI container archive
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: false
          push: false
          tags: lazy-observe:preflight-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=oci,dest=${{ runner.temp }}/lazy-observe-linux-${{ matrix.arch }}.oci.tar
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ needs.build-meta.outputs.version }}
            COMMIT=${{ needs.build-meta.outputs.commit }}
            DATE=${{ needs.build-meta.outputs.date }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
      - name: Load and verify immutable OCI archive
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          oci_tar="${RUNNER_TEMP}/lazy-observe-linux-${ARCH}.oci.tar"
          docker_tar="${RUNNER_TEMP}/lazy-observe-linux-${ARCH}.docker.tar"
          trap 'rm -f "$docker_tar"' EXIT
          digest=$(bash scripts/merge-oci-layouts.sh inspect \
            --archive "$oci_tar" \
            --arch "$ARCH" \
            --digest-out "${RUNNER_TEMP}/lazy-observe-linux-${ARCH}.digest" \
            --sha256-out "${RUNNER_TEMP}/lazy-observe-linux-${ARCH}.oci.tar.sha256" \
            --docker-tar-out "$docker_tar" \
            --repo-tag "lazy-observe:preflight-${ARCH}")
          docker load -i "$docker_tar"
          rm -f "$docker_tar"
          printf 'Verified and loaded linux/%s immutable manifest %s\n' "$ARCH" "$digest"
      # 发版前挡住：CRITICAL/HIGH 且已有修复版本的漏洞让 container-check 失败，archive 与 docker 都不会运行。
      # 扫描器按版本 + sha256 固定，例外写进 .trivyignore.yaml（见 scripts/check-image-vulns.sh）。
      - name: Scan container for fixable CRITICAL/HIGH vulnerabilities
        run: bash scripts/check-image-vulns.sh lazy-observe:preflight-${{ matrix.arch }}
      - name: Smoke container
        run: bash scripts/check-container-smoke.sh lazy-observe:preflight-${{ matrix.arch }} linux/${{ matrix.arch }}
      - name: Upload verified OCI container archive
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oci-image-linux-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/lazy-observe-linux-${{ matrix.arch }}.oci.tar
            ${{ runner.temp }}/lazy-observe-linux-${{ matrix.arch }}.oci.tar.sha256
            ${{ runner.temp }}/lazy-observe-linux-${{ matrix.arch }}.digest
          if-no-files-found: error
          retention-days: 1

  # 嵌入的 Victoria 二进制在 lazy-observe 里是 gzip 后 go:embed 的 payload，镜像与归档里没有独立的可执行文件，
  # 上面的镜像扫描读不到它们的 Go buildinfo。这里对下载并校验过 sha256 的原始上游二进制（amd64 + arm64，
  # Trivy 只读静态 buildinfo，一台 runner 即可）跑 trivy rootfs：参数与镜像扫描一致，例外共用 .trivyignore.yaml。
  # 嵌入的是上游官方二进制、不自行编译（ADR 0016），所以命中只警告（::warning:: 注解 + step summary），不阻塞发版。
  # 但扫描没跑成（Trivy 出错、没有恰好识别出四个 Go 二进制、报告与退出码对不上）时本 job 失败；archive 依赖本 job，
  # 失败会挡住出包。细节见 scripts/check-storage-bin-vulns.sh。
  storage-bin-scan:
    name: Embedded storage binary vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan embedded Victoria binaries for fixable CRITICAL/HIGH vulnerabilities (warn only)
        run: bash scripts/check-storage-bin-vulns.sh

  # 性能门禁不跟 PR 跑，改为挡在发版链路上：tag 发布和手动 snapshot 都必须先过这一关。
  # 步骤与 bench.yml（手动触发与每周定时）一致，由 scripts/check-e2e-contract.sh 校验。
  performance-gates:
    name: Ingest, release, query, and HA gates
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Docker access
        run: bash scripts/ci-setup-docker.sh
      - name: Calculate cache keys
        id: cache-keys
        run: bash scripts/ci-cache-keys.sh
      # tag 触发时 ref 是 refs/tags/*，写进去的缓存别的 tag 和 main 都读不到，所以这个 workflow 只在 main 上保存
      # （手动 snapshot 选 main 时）；其余情况只读 ci.yml 在 main 上保存的缓存。缓存规矩见 ci.yml 顶部注释。
      - name: Restore mise binary cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/mise
          key: mise-bin-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.mise-bin }}
      - name: Restore mise cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-base-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.mise }}
          restore-keys: mise-base-${{ runner.os }}-${{ runner.arch }}-
      - name: Install mise toolchain
        run: bash scripts/ci-setup-mise.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_CI_PROFILE: perf-gates
      - name: Restore Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ steps.cache-keys.outputs.go }}
          restore-keys: gomod-
      - name: Restore Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: gobuild-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.go-toolchain }}-${{ steps.cache-keys.outputs.go }}
          restore-keys: gobuild-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.go-toolchain }}-
      - name: Restore pnpm cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: pnpm-web-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.pnpm-web }}
          restore-keys: pnpm-web-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore cross-platform storage archives
        id: storage-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/storage-bin/.archives
            .cache/storage-bin/*/.archives
          key: storage-all-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.storage }}
          restore-keys: storage-all-${{ runner.os }}-${{ runner.arch }}-
      - name: Run 30 second ingest benchmark and relative gate
        run: BENCH_DURATION=30s BENCH_BASELINE=bench/baseline.json BENCH_OUTPUT=bench/results/ingest.json mise run bench
      - name: Gate Linux release artifacts and zero-config startup
        run: mise run perf-release
      - name: Gate exact query latency and capacity-controlled weak scaling
        run: mise run perf-ha
      - name: Validate performance result contract
        run: mise run perf-results-check
      - name: Save cross-platform storage archives
        if: github.ref == 'refs/heads/main' && steps.storage-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/storage-bin/.archives
            .cache/storage-bin/*/.archives
          key: ${{ steps.storage-cache.outputs.cache-primary-key }}
      - name: Upload performance gate results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-gate-results-failure
          path: bench/results/
          if-no-files-found: ignore
          retention-days: 7

  archive:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Snapshot archives' || 'Publish draft archives' }}
    needs: [container-check, storage-bin-scan, performance-gates]
    runs-on: ubuntu-24.04
    permissions:
      # GoReleaser creates the draft GitHub Release and uploads archives;
      # actions/attest signs SLSA provenance for the release archives.
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Calculate cache keys
        id: cache-keys
        run: bash scripts/ci-cache-keys.sh
      # release 工具集（goreleaser、go-licenses）只有这个 job 用，自己一份 mise 缓存；tag 触发时只读，
      # 手动 snapshot 选 main 时才保存（原因见上面 performance-gates 的注释）。gomod、gobuild、pnpm、storage
      # 与 performance-gates 共用同一批 key，只读。
      - name: Restore mise binary cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/mise
          key: mise-bin-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.mise-bin }}
      - name: Restore release mise cache
        id: mise-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.mise }}
          restore-keys: mise-release-${{ runner.os }}-${{ runner.arch }}-
      - name: Install release toolchain
        run: bash scripts/ci-setup-mise.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISE_CI_PROFILE: release
      - name: Restore Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ steps.cache-keys.outputs.go }}
          restore-keys: gomod-
      - name: Restore Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: gobuild-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.go-toolchain }}-${{ steps.cache-keys.outputs.go }}
          restore-keys: gobuild-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.go-toolchain }}-
      - name: Restore pnpm cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: pnpm-web-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.pnpm-web }}
          restore-keys: pnpm-web-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore cross-platform storage archives
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/storage-bin/.archives
            .cache/storage-bin/*/.archives
          key: storage-all-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.storage }}
          restore-keys: storage-all-${{ runner.os }}-${{ runner.arch }}-
      - name: Validate snapshot configuration
        if: github.event_name == 'workflow_dispatch'
        run: mise run release-snapshot-check
      - name: Build snapshot archives
        if: github.event_name == 'workflow_dispatch'
        run: mise run snapshot
      - name: Upload snapshot archives
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-snapshot
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          if-no-files-found: error
      - name: Validate publish prerequisites
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || {
            echo 'release tag commit is not reachable from main' >&2
            exit 1
          }
          mise run release-publish-check
      - name: Publish draft GoReleaser archives
        if: github.event_name == 'push'
        run: mise run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest release archive build provenance
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt
      - name: Prune stale mise tools
        if: github.ref == 'refs/heads/main' && steps.mise-cache.outputs.cache-hit != 'true'
        run: mise prune --tools --yes
      - name: Save release mise cache
        if: github.ref == 'refs/heads/main' && steps.mise-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: ${{ steps.mise-cache.outputs.cache-primary-key }}

  docker:
    name: Publish, sign, and attest multi-platform container
    if: github.event_name == 'push'
    needs: [build-meta, archive]
    runs-on: ubuntu-24.04
    permissions:
      # 无构建发布：本 job 不运行 Dockerfile/BuildKit，只校验并推送 container-check 产出的
      # 不可变 OCI 镜像层，随后对最终多架构 index digest 执行 Cosign keyless 签名与
      # GitHub Provenance/SBOM Attestation。回填 Release 资产交给 helm-values job。
      contents: read
      packages: write
      id-token: write
      attestations: write
    # digest 只有推完多架构 index 才存在；helm-values job 通过 outputs 拿到同一 digest 与版本号。
    outputs:
      version: ${{ needs.build-meta.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Calculate cache keys
        id: cache-keys
        run: bash scripts/ci-cache-keys.sh
      - name: Restore mise binary cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/mise
          key: mise-bin-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.mise-bin }}
      - name: Install container publish toolchain
        run: bash scripts/ci-setup-mise.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISE_CI_PROFILE: docker-publish
      - name: Download verified OCI container archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: oci-image-linux-*
          path: ${{ runner.temp }}/oci-artifacts
          merge-multiple: true
      - name: Verify checksums and assemble multi-platform OCI layout
        run: |
          mise exec jq -- bash scripts/merge-oci-layouts.sh merge \
            --input-dir "${RUNNER_TEMP}/oci-artifacts" \
            --output-dir "${RUNNER_TEMP}/merged-oci" \
            --sbom-dir "${RUNNER_TEMP}/sbom-amd64"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/eimsound/lazy-observe
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Push verified multi-platform OCI index and verify digests
        id: push
        env:
          IMAGE_REPO: ghcr.io/eimsound/lazy-observe
          IMAGE_VERSION: ${{ needs.build-meta.outputs.version }}
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          pushed_ref=$(mise exec crane -- crane push --index "${RUNNER_TEMP}/merged-oci" "${IMAGE_REPO}:${IMAGE_VERSION}")
          digest=${pushed_ref##*@}
          if [[ ! $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'unexpected pushed index digest: %s\n' "$pushed_ref" >&2
            exit 1
          fi
          while IFS= read -r full_tag; do
            [[ -n $full_tag ]] || continue
            tag_name=${full_tag#"${IMAGE_REPO}:"}
            [[ $tag_name == "$IMAGE_VERSION" ]] && continue
            mise exec crane -- crane tag "${IMAGE_REPO}@${digest}" "$tag_name"
          done <<<"$META_TAGS"
          remote_index=$(mise exec crane -- crane manifest "${IMAGE_REPO}@${digest}")
          for arch in amd64 arm64; do
            want=$(tr -d '[:space:]' <"${RUNNER_TEMP}/oci-artifacts/lazy-observe-linux-${arch}.digest")
            got=$(mise exec jq -- jq -er --arg arch "$arch" \
              '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' \
              <<<"$remote_index")
            if [[ $got != "$want" ]]; then
              printf 'remote index digest mismatch for linux/%s: got %s, want %s\n' "$arch" "$got" "$want" >&2
              exit 1
            fi
          done
          printf 'Verified pushed multi-arch index %s@%s\n' "$IMAGE_REPO" "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Generate SPDX SBOM from verified OCI image
        run: |
          trivy=$(bash scripts/install-trivy.sh)
          mkdir -p dist
          "$trivy" image \
            --input "${RUNNER_TEMP}/sbom-amd64" \
            --format spdx-json \
            --output dist/lazy-observe-sbom.spdx.json \
            --skip-version-check \
            --no-progress
          [[ -s dist/lazy-observe-sbom.spdx.json ]] || { echo 'SBOM generation produced an empty file' >&2; exit 1; }
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign multi-platform image with Cosign (keyless)
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes --recursive "ghcr.io/eimsound/lazy-observe@${IMAGE_DIGEST}"
      - name: Attest container build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/eimsound/lazy-observe
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Attest container SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/eimsound/lazy-observe
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: dist/lazy-observe-sbom.spdx.json
          push-to-registry: true

  # chart 本身不打包也不发布（仍在 deploy/helm/lazy-observe）；digest 只有推完多架构镜像才存在，
  # 且 GoReleaser 已在 archive job 建好 draft Release，所以回填的做法是把 digest 写成 values
  # 片段挂到本次 draft Release 上，而不是把 digest 提交回 main（AFK 契约禁止直推 main，
  # 提交回 main 也只会让 chart 永远指向上一个版本的镜像）。
  # 单独开一个 job 而不是塞进 docker：写仓库 Release 资产的权限只出现在这里与 publish-release。
  helm-values:
    name: Attach digest-pinned Helm values
    if: github.event_name == 'push'
    needs: docker
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # 生成脚本在仓库里（scripts/render-helm-release-values.sh），所以要 checkout。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Render digest-pinned Helm values
        env:
          IMAGE_DIGEST: ${{ needs.docker.outputs.digest }}
          IMAGE_TAG: ${{ needs.docker.outputs.version }}
        run: |
          bash scripts/render-helm-release-values.sh \
            --repository ghcr.io/eimsound/lazy-observe \
            --tag "$IMAGE_TAG" \
            --digest "$IMAGE_DIGEST" \
            --output "dist/helm-values-lazy-observe-$IMAGE_TAG.yaml"
      - name: Attach digest-pinned Helm values to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          HELM_VALUES_FILE: dist/helm-values-lazy-observe-${{ needs.docker.outputs.version }}.yaml
        run: |
          max_attempts=5
          delay=2
          for attempt in 1 2 3 4 5; do
            if gh release upload "$RELEASE_TAG" "$HELM_VALUES_FILE" --repo "$GITHUB_REPOSITORY" --clobber; then
              exit 0
            fi
            if [[ $attempt -eq $max_attempts ]]; then
              printf 'failed to upload %s to draft release %s after %d attempts\n' \
                "$HELM_VALUES_FILE" "$RELEASE_TAG" "$max_attempts" >&2
              exit 1
            fi
            printf 'gh release upload failed (attempt %d/%d); retrying in %ds...\n' \
              "$attempt" "$max_attempts" "$delay" >&2
            sleep "$delay"
            delay=$((delay * 2))
          done

  # 仅在 GoReleaser 归档、多架构不可变容器推送、Cosign 签名、Provenance/SBOM Attestation
  # 与 digest 固定 helm-values 资产全部成功后，才将 draft Release 公开，避免中途失败留下半残公开 Release。
  publish-release:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    needs: helm-values
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Mark draft release as published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          max_attempts=5
          delay=2
          for attempt in 1 2 3 4 5; do
            if gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false; then
              exit 0
            fi
            if [[ $attempt -eq $max_attempts ]]; then
              printf 'failed to publish draft release %s after %d attempts\n' \
                "$RELEASE_TAG" "$max_attempts" >&2
              exit 1
            fi
            printf 'gh release edit failed (attempt %d/%d); retrying in %ds...\n' \
              "$attempt" "$max_attempts" "$delay" >&2
            sleep "$delay"
            delay=$((delay * 2))
          done
