name: CI

# 增量 CI：changes 作业按改动面输出布尔标志（scripts/ci-changes.sh），各业务 job 按标志
# 决定跑还是跳过；最后的 ci-ok 汇总 job 是唯一的 required check，被跳过的 job 算通过。
# 纯文档改动所有业务 job 跳过。动到打包链路时 arm64 构建与冒烟进入 build 矩阵，
# 发版前 release.yml 再对两个架构兜底。服务端改动另跑多副本 HA 功能门禁（e2e-ha）；
# SDK、服务端与前端改动另跑 SDK journeys（真实平台 + Go/Node/Python/Browser 四个 SDK 的端到端 journey）；
# 性能门禁（perf-ha、perf-release、bench）不进 PR，只在 bench.yml 手动和 release.yml 发版前跑。
#
# 所有 job 直接跑在 GitHub 托管 runner 上，工具由 scripts/ci-setup-mise.sh 安装，mise 目录按工具集缓存。
#
# Actions cache 的规矩（仓库总量上限 10 GB，超了按最久未访问淘汰；调查与估算见 .agents/docs/research/actions-cache.md）：
# - 只有 main 上保存。所有 cache 都是 `actions/cache/restore` 开头，job 末尾再用 `actions/cache/save`，
#   save 带 `github.ref == 'refs/heads/main' && cache-hit != 'true'`：PR（refs/pull/N/merge）、integration/**、
#   tag 都只读 main 的缓存，不写。PR 改了 go.mod / mise.toml 时拿不到精确命中，走 restore-keys 回退到 main 最新一份。
# - Go 缓存拆成两份：
#   1) `gomod-<go-hash>`（~/go/pkg/mod）：纯源码，跨架构且跨 Go 版本共用，只由 `go` job 保存一份；
#   2) `gobuild-<os>-<arch>-<go-toolchain>-<go-hash>`（~/.cache/go-build）：按架构与精确 Go 版本隔离，
#      绝不跨 Go 版本 restore-keys（避免把旧 Go 的死对象文件拖进新版本缓存），由 `go` job（X64）与
#      `go-cross` 的 arm64 格保存，其余 job（e2e、e2e-restart、e2e-ha、meta-pg、sdk-go、sdk-journeys）只读。
#   为避免 `main` 上的 writer 恢复前代缓存后再叠写并整包保存导致单条体积跨代膨胀，
#   `gomod` 与 `gobuild` 的 writer 在 `refs/heads/main` 上不设 `restore-keys`（精确未命中时冷编生成干净单代基线），
#   PR 与只读消费者仍保留 `restore-keys` 回退加速。
# - mise 缓存只按 mise.toml 的 `[tools]` 表哈希（scripts/ci-cache-keys.sh），改任务定义或注释不失效；
#   base 工具集共用 `mise-base-*`（仅由 `go-cross` 保存 X64/ARM64，其余 base job 与 sdk-python/meta-pg/sdk-journeys 只读），
#   `sdk-go` 只读 `mise-go-*` 并配 `--skip-tools`，`sdk-node` 与 `sdk-browser` 共用 `mise-sdk-node-<node>-pnpm-<pnpm>-*`
#   （仅由 `sdk-node` 保存，配 `--skip-tools`，不装 Go/air/golines 等无关工具、不跨版本回退）。保存 `mise-go`/`mise-base`
#   前先 `mise prune --tools --yes`，避免升版后把旧版本工具一并打包进新缓存。
# - 每个共享 key 在同一次 workflow 运行内严格只有一个 writer（`go` 写 `mise-go`/`gomod`/`gobuild-X64`，`go-cross` 写
#   `mise-base` 与 ARM64 的 `gobuild`/`pnpm-web`，`web` 写 X64 的 `pnpm-web`，`e2e(storage)` 写 `storage-native`，
#   `sdk-node` 写 `mise-sdk-node-*`），避免并发 save 冲突。
# - pnpm 的 key 不带 mise.toml 哈希，其它工具升版不会让它们整份换新；`sdk-journeys` 按工作区隔离目录只读复用
#   `pnpm-web` / `pnpm-sdk-node` / `pnpm-sdk-browser` 三个独立 store，不额外保存三锁合一副本；`playwright-sdk-journeys-*`
#   仅按 `playwright-core` 精确版本键控且不设跨版本 `restore-keys`。
# - 不在这里清理 cache：删除要 actions: write，会扩大 token 权限面。
#
# 切片分支只靠 pull_request 跑一遍；push 只留给合并后的 main 和 integration 分支。
on:
  push:
    branches:
      - main
      - "integration/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# mise 在 job 中途按需安装 task 工具时也要带 token，否则 GitHub API 匿名限流会让安装 403。
env:
  MISE_GITHUB_TOKEN: ${{ github.token }}

jobs:
  changes:
    name: Detect change surface
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      go: ${{ steps.detect.outputs.go }}
      build: ${{ steps.detect.outputs.build }}
      e2e: ${{ steps.detect.outputs.e2e }}
      ha: ${{ steps.detect.outputs.ha }}
      web: ${{ steps.detect.outputs.web }}
      meta_pg: ${{ steps.detect.outputs.meta_pg }}
      arm64: ${{ steps.detect.outputs.arm64 }}
      sdk_go: ${{ steps.detect.outputs.sdk_go }}
      sdk_node: ${{ steps.detect.outputs.sdk_node }}
      sdk_browser: ${{ steps.detect.outputs.sdk_browser }}
      sdk_python: ${{ steps.detect.outputs.sdk_python }}
      sdk_journeys: ${{ steps.detect.outputs.sdk_journeys }}
      sdk_journeys_only: ${{ steps.detect.outputs.sdk_journeys_only }}
      trivy_pin: ${{ steps.detect.outputs.trivy_pin }}
      docs: ${{ steps.detect.outputs.docs }}
      build_matrix: ${{ steps.detect.outputs.build_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect change surface
        id: detect
        run: bash scripts/ci-changes.sh
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_BEFORE_SHA: ${{ github.event.before }}

  go:
    name: Go, licenses, Helm
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Calculate cache keys
        id: cache-keys
        run: bash scripts/ci-cache-keys.sh
      # go-ci 工具集（含 golangci-lint、helm 等）由这个 job 保存，sdk-go 只读复用。
      - name: Restore mise cache
        id: mise-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-go-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.mise }}
          restore-keys: mise-go-${{ runner.os }}-${{ runner.arch }}-
      - name: Install mise toolchain
        run: bash scripts/ci-setup-mise.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_CI_PROFILE: go-ci
      # GOMODCACHE 跨架构且跨 Go 版本共用，只由这个 job 保存；GOCACHE 按架构和 Go 版本隔离，
      # 不跨 Go 版本回退，避免旧版编译产物滞留在新缓存里。main 上的 writer 取消 restore-keys，
      # 精确未命中时从干净基线重新构建并保存单代缓存，防止跨代叠写滚雪球；PR 与只读消费者仍保留回退加速。
      - name: Restore Go module cache
        id: gomod-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ steps.cache-keys.outputs.go }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && 'gomod-' || '' }}
      - name: Restore Go build cache
        id: gobuild-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: gobuild-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.go-toolchain }}-${{ steps.cache-keys.outputs.go }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && format('gobuild-{0}-{1}-{2}-', runner.os, runner.arch, steps.cache-keys.outputs.go-toolchain) || '' }}
      - run: mise run workflow-check
      - run: mise run install-check
      - run: mise run release-prerequisites-test
      - run: mise run migration-check
      - run: mise run ent-generate-check
      - run: mise run license-check
      # 服务端模块与 sdk/go 的可达漏洞；漏洞库运行时从 vuln.go.dev 拉取，新公告可能让无关 PR 变红。
      - run: mise run vulncheck
      - run: mise run fmt-check
      - run: mise run mod-tidy-check
      - run: mise run lint
      - run: mise run vet
      - run: mise run test
      - run: mise run helm-lint
      - run: mise run helm-template-test
      - name: Prune stale mise tools
        if: github.ref == 'refs/heads/main' && steps.mise-cache.outputs.cache-hit != 'true'
        run: mise prune --tools --yes
      - name: Save mise cache
        if: github.ref == 'refs/heads/main' && steps.mise-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: ${{ steps.mise-cache.outputs.cache-primary-key }}
      - name: Save Go module cache
        if: github.ref == 'refs/heads/main' && steps.gomod-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ steps.gomod-cache.outputs.cache-primary-key }}
      - name: Save Go build cache
        if: github.ref == 'refs/heads/main' && steps.gobuild-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.gobuild-cache.outputs.cache-primary-key }}

  go-cross:
    name: Go build (linux/${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Calculate cache keys
        id: cache-keys
        run: bash scripts/ci-cache-keys.sh
      # mise-base 是所有 base 工具集 job 的共用 key，唯一 writer 是本 job（覆盖 X64 与 ARM64）。
      - name: Restore mise cache
        id: mise-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-base-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.mise }}
          restore-keys: mise-base-${{ runner.os }}-${{ runner.arch }}-
      - name: Install mise toolchain
        run: bash scripts/ci-setup-mise.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # gomod 跨架构只读复用 go job 的一份；arm64 的 gobuild 与 pnpm store 由这里的 arm64 格保存（X64 由 go、web 保存）。
      - name: Restore Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ steps.cache-keys.outputs.go }}
          restore-keys: gomod-
      - name: Restore Go build cache
        id: gobuild-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: gobuild-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.go-toolchain }}-${{ steps.cache-keys.outputs.go }}
          restore-keys: ${{ (github.ref != 'refs/heads/main' || matrix.arch != 'arm64') && format('gobuild-{0}-{1}-{2}-', runner.os, runner.arch, steps.cache-keys.outputs.go-toolchain) || '' }}
      - name: Restore pnpm cache
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: pnpm-web-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.pnpm-web }}
          restore-keys: pnpm-web-${{ runner.os }}-${{ runner.arch }}-
      - name: Build real embedded artifact
        run: mise run dist
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          BINARY: .cache/build/linux-${{ matrix.arch }}/lazy-observe
      - name: Record embedded artifact evidence
        run: mise x go uv -- bash scripts/check-embedded-artifact.sh ".cache/build/linux-${{ matrix.arch }}/lazy-observe" "linux/${{ matrix.arch }}"
        env:
          LO_ARTIFACT_EVIDENCE: .cache/artifact-evidence/linux-${{ matrix.arch }}.json
      - name: Prune stale mise tools
        if: github.ref == 'refs/heads/main' && steps.mise-cache.outputs.cache-hit != 'true'
        run: mise prune --tools --yes
      - name: Save mise cache
        if: github.ref == 'refs/heads/main' && steps.mise-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: ${{ steps.mise-cache.outputs.cache-primary-key }}
      - name: Save Go build cache
        if: github.ref == 'refs/heads/main' && matrix.arch == 'arm64' && steps.gobuild-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.gobuild-cache.outputs.cache-primary-key }}
      - name: Save pnpm cache
        if: github.ref == 'refs/heads/main' && matrix.arch == 'arm64' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}

  artifact-smoke:
    name: Zero-config artifact smoke (linux/${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Docker access
        run: bash scripts/ci-setup-docker.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # 不用默认的 moby/buildkit:buildx-stable-1：按具体版本 + 多架构 index digest 固定。
          driver-opts: image=moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb
      - name: Build loadable zero-config artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker buildx build \
            --platform "linux/${{ matrix.arch }}" \
            --load \
            --provenance=false \
            --sbom=false \
            --secret "id=github_token,env=GITHUB_TOKEN" \
            --tag "lazy-observe:ci-${{ matrix.arch }}" \
            .
      - name: Smoke real embedded artifact
        run: bash scripts/check-container-smoke.sh "lazy-observe:ci-${{ matrix.arch }}" "linux/${{ matrix.arch }}"

  # 网关 e2e 大多在等固定观察窗口（自监控 70s、静默告警 50s 等），串行要 6 分钟以上，
  # 所以按测试分到并行分片；check-e2e-contract.sh 校验分片的并集正好是全集。
  e2e:
    name: Gateway E2E (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: storage
            gateway_tests: "StorageGateway"
          - shard: self-monitoring
            gateway_tests: "SelfMonitoringDisabled"
          - shard: alerts-scrape-tls
            gateway_tests: "LogsAlert|ScrapeManagement|NativeTLSLoopback"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Calculate cache keys
        id: cache-keys
        run: bash scripts/ci-cache-keys.sh
      # mise-base 由 go-cross 唯一保存，这里只读。
      - name: Restore mise cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-base-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.mise }}
          restore-keys: mise-base-${{ runner.os }}-${{ runner.arch }}-
      - name: Install mise toolchain
        run: bash scripts/ci-setup-mise.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Go 缓存只读：保存由 go job 负责。
      - name: Restore Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ steps.cache-keys.outputs.go }}
          restore-keys: gomod-
      - name: Restore Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: gobuild-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.go-toolchain }}-${{ steps.cache-keys.outputs.go }}
          restore-keys: gobuild-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.go-toolchain }}-
      - name: Restore storage archives cache
        id: storage-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/storage-bin/.archives
          key: storage-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.storage }}
          restore-keys: storage-native-${{ runner.os }}-${{ runner.arch }}-
      - run: mise run e2e
        env:
          LO_E2E_GATEWAY_TESTS: ${{ matrix.gateway_tests }}
      # storage-native 的唯一 writer 是 storage 分片，避免三路分片及 e2e-ha/sdk-journeys 并发上传同一个 key。
      - name: Save storage archives cache
        if: github.ref == 'refs/heads/main' && matrix.shard == 'storage' && steps.storage-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/storage-bin/.archives
          key: ${{ steps.storage-cache.outputs.cache-primary-key }}

  e2e-restart:
    name: Gateway same-data-dir restart fixture
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Calculate cache keys
        id: cache-keys
        run: bash scripts/ci-cache-keys.sh
      # 与 e2e 使用完全相同的触发标志，mise-base 由 go-cross 保存、storage-native 由 e2e(storage) 保存，这里全部只读。
      - name: Restore mise cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-base-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.mise }}
          restore-keys: mise-base-${{ runner.os }}-${{ runner.arch }}-
      - name: Install mise toolchain
        run: bash scripts/ci-setup-mise.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Restore Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ steps.cache-keys.outputs.go }}
          restore-keys: gomod-
      - name: Restore Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: gobuild-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.go-toolchain }}-${{ steps.cache-keys.outputs.go }}
          restore-keys: gobuild-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.go-toolchain }}-
      - name: Restore storage archives cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/storage-bin/.archives
          key: storage-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.storage }}
          restore-keys: storage-native-${{ runner.os }}-${{ runner.arch }}-
      - run: mise run e2e-restart

  # 多副本 HA 功能门禁：双副本网关 + VM 集群（含一个 vmstorage 掉线）、VLogs/VTraces 分角色、
  # SeaweedFS S3、Postgres 告警租约与 Outbox、Valkey 会话。只跑功能断言（不设 LO_E2E_PERF_GATES），
  # 性能部分留给 bench.yml / release.yml 的 perf-ha。依赖缺失时脚本以 77 退出，在 CI 里算失败。
  e2e-ha:
    name: HA E2E (multi-replica)
    needs: changes
    if: needs.changes.outputs.ha == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Docker access
        run: bash scripts/ci-setup-docker.sh
      - name: Calculate cache keys
        id: cache-keys
        run: bash scripts/ci-cache-keys.sh
      # mise-base 由 go-cross 唯一保存、gomod/gobuild 由 go 保存、storage-native 由 e2e(storage) 保存，这里全部只读。
      - name: Restore mise cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-base-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.mise }}
          restore-keys: mise-base-${{ runner.os }}-${{ runner.arch }}-
      - name: Install mise toolchain
        run: bash scripts/ci-setup-mise.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Restore Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ steps.cache-keys.outputs.go }}
          restore-keys: gomod-
      - name: Restore Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: gobuild-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.go-toolchain }}-${{ steps.cache-keys.outputs.go }}
          restore-keys: gobuild-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.go-toolchain }}-
      - name: Restore storage archives cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/storage-bin/.archives
          key: storage-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.storage }}
          restore-keys: storage-native-${{ runner.os }}-${{ runner.arch }}-
      - run: mise run e2e-ha

  web:
    name: Web typecheck and build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Calculate cache keys
        id: cache-keys
        run: bash scripts/ci-cache-keys.sh
      # mise-base 由 go-cross 唯一保存，这里只读。
      - name: Restore mise cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-base-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.mise }}
          restore-keys: mise-base-${{ runner.os }}-${{ runner.arch }}-
      - name: Install mise toolchain
        run: bash scripts/ci-setup-mise.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # X64 的 pnpm store（web 工作区）由这个 job 保存，go-cross 的 arm64 格保存 arm64 那份。
      - name: Restore pnpm cache
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: pnpm-web-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.pnpm-web }}
          restore-keys: pnpm-web-${{ runner.os }}-${{ runner.arch }}-
      - run: mise run web
      - name: Save pnpm cache
        if: github.ref == 'refs/heads/main' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}

  meta-pg:
    name: PostgreSQL metadata tests
    needs: changes
    if: needs.changes.outputs.meta_pg == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Calculate cache keys
        id: cache-keys
        run: bash scripts/ci-cache-keys.sh
      # 只读 base 工具集的缓存（go 在里面）；保存由其它 base job 负责。
      - name: Restore mise cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-base-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.mise }}
          restore-keys: mise-base-${{ runner.os }}-${{ runner.arch }}-
      - name: Install mise toolchain
        run: bash scripts/ci-setup-mise.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_CI_PROFILE: meta-pg
      - name: Restore Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ steps.cache-keys.outputs.go }}
          restore-keys: gomod-
      - name: Restore Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: gobuild-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.go-toolchain }}-${{ steps.cache-keys.outputs.go }}
          restore-keys: gobuild-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.go-toolchain }}-
      # embedded-postgres v2 从 GitHub 下载固定的 Postgres 发行包（theseus-rs/postgresql-binaries），解到
      # 缓存目录（mise 的 test-meta-pg 任务默认用 $HOME/.cache/embedded-postgres，解压后约 117 MB，
      # actions/cache 压缩后约 37 MB）。命中时不再联网。supervisor 不下载也不进这个缓存：
      # internal/embeddedpg 用 go build 从 go.sum 固定的模块源码现编（走上面的 go-build 缓存）。
      # key 固定 runner os/arch、库版本（来自 go.mod）和发行包版本 18.6.1（embedded-postgres 的 V18），
      # 升级库或换 PG 版本时一起改。这个缓存只是加速，不是保证：仓库 cache 总量超过 10 GB 时会被 LRU 淘汰
      # （UTC 2026-11-19 23:46 main 命中、32 分钟后的 PR 未命中，仓库内没有删 cache 的步骤）。未命中时由
      # internal/embeddedpg 经带退避重试的 HTTP 客户端下载：对 403/404/408/429/5xx 与网络错误重试，
      # sha256 由库内置清单固定并强制校验，仍失败就让测试失败，不会跳过。
      # 只有 main 保存（PR 不写）；缓存收口方案见 .agents/docs/research/actions-cache.md。
      - name: Resolve embedded Postgres module version
        id: embedded-pg
        run: |
          module=$(awk '$1 == "github.com/fergusstrange/embedded-postgres/v2" { print $2 }' go.mod)
          if [[ -z $module ]]; then
            printf 'embedded-postgres/v2 is missing from go.mod\n' >&2
            exit 1
          fi
          printf 'module=%s\n' "$module" >>"$GITHUB_OUTPUT"
      - name: Restore embedded Postgres distribution
        id: embedded-pg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/embedded-postgres
          key: embedded-pg-${{ runner.os }}-${{ runner.arch }}-18.6.1-${{ steps.embedded-pg.outputs.module }}
          restore-keys: embedded-pg-${{ runner.os }}-${{ runner.arch }}-18.6.1-
      - name: Run PostgreSQL tests when migrations exist
        run: mise run --skip-tools test-meta-pg
      - name: Save embedded Postgres distribution
        if: github.ref == 'refs/heads/main' && steps.embedded-pg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/embedded-postgres
          key: ${{ steps.embedded-pg-cache.outputs.cache-primary-key }}

  sdk-go:
    name: Go SDK (build, vet, lint, test)
    needs: changes
    if: needs.changes.outputs.sdk_go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Calculate cache keys
        id: cache-keys
        run: bash scripts/ci-cache-keys.sh
      # 只读复用 go job 的 mise-go（已含 go 与 golangci-lint）以及 gomod/gobuild（go job 的 vulncheck 与
      # replace 依赖已覆盖 sdk/go 的绝大多数模块与编译产物），配 --skip-tools 避免装无关工具，不再单存一份。
      - name: Restore mise cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-go-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.mise }}
          restore-keys: mise-go-${{ runner.os }}-${{ runner.arch }}-
      - name: Install mise toolchain
        run: bash scripts/ci-setup-mise.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_CI_TOOLS: go golangci-lint
      - name: Restore Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ steps.cache-keys.outputs.go }}
          restore-keys: gomod-
      - name: Restore Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: gobuild-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.go-toolchain }}-${{ steps.cache-keys.outputs.go }}
          restore-keys: gobuild-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.go-toolchain }}-
      - run: mise run --skip-tools sdk-go

  # Node SDK：同一条 `mise run sdk-node` 按 LO_SDK_NODE_VERSION 在 Node 22 / 24 / 26 三条受支持的主线上跑完整套件
  # （mise 管 node，不用 setup-node）。版本精确到 patch，取每条线发布满 7 天的最新 patch；mise.toml 的 node 与 26 这一格同值。
  # ci-ok 按 job id 汇总：矩阵里任何一格失败，sdk-node 的 result 就是 failure。
  sdk-node:
    name: Node SDK (Node ${{ matrix.node }})
    needs: changes
    if: needs.changes.outputs.sdk_node == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: "22.23.5"
            save_pnpm: false
          - node: "24.22.3"
            save_pnpm: false
          - node: "26.13.1"
            save_pnpm: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Calculate cache keys
        id: cache-keys
        run: bash scripts/ci-cache-keys.sh
      # sdk-node 与 sdk-browser 只装 pnpm + 这一格的 node，任务走 --skip-tools 不装 Go/air/golines 等无关工具，
      # 两边共用 mise-sdk-node-<node>-pnpm-<pnpm>-* 一份约 50 MB 的小缓存；不设跨版本 restore-keys 避免把旧版或旧的
      # 260 MB 膨胀缓存拖回来。
      - name: Restore mise cache
        id: mise-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-sdk-node-${{ matrix.node }}-pnpm-${{ steps.cache-keys.outputs.pnpm-toolchain }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install mise toolchain
        run: bash scripts/ci-setup-mise.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # 只装 mise.toml 钉的 pnpm 和矩阵这一格的 node；后面用 --skip-tools 运行任务，不再装 mise.toml 的其它工具。
          MISE_CI_TOOLS: pnpm node@${{ matrix.node }}
      - name: Restore pnpm cache
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: pnpm-sdk-node-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sdk/node/pnpm-lock.yaml') }}
          restore-keys: pnpm-sdk-node-${{ runner.os }}-${{ runner.arch }}-
      - run: mise run --skip-tools sdk-node
        env:
          LO_SDK_NODE_VERSION: ${{ matrix.node }}
      - name: Save mise cache
        if: github.ref == 'refs/heads/main' && steps.mise-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: ${{ steps.mise-cache.outputs.cache-primary-key }}
      - name: Save pnpm cache
        if: github.ref == 'refs/heads/main' && matrix.save_pnpm && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}

  # Browser SDK：bundler-plugin 只发 ESM，靠 Node 22.15+ 的 require(esm) 服务 CJS 调用方，所以它的加载冒烟
  # （`mise run sdk-browser-smoke`）在 22 / 24 / 26 上各跑一遍；浏览器 SDK 的其余测试与 Node 版本无关，只在 26 上跑完整的
  # `mise run sdk-browser`。版本选择规则同 sdk-node。
  sdk-browser:
    name: Browser SDK (Node ${{ matrix.node }})
    needs: changes
    if: needs.changes.outputs.sdk_browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: "22.23.5"
            task: sdk-browser-smoke
          - node: "24.22.3"
            task: sdk-browser-smoke
          - node: "26.13.1"
            task: sdk-browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Calculate cache keys
        id: cache-keys
        run: bash scripts/ci-cache-keys.sh
      # 与 sdk-node 共用同一份 mise 缓存（由 sdk-node 唯一保存，这里只读，避免并发 save 同一 key）。
      - name: Restore mise cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-sdk-node-${{ matrix.node }}-pnpm-${{ steps.cache-keys.outputs.pnpm-toolchain }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install mise toolchain
        run: bash scripts/ci-setup-mise.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_CI_TOOLS: pnpm node@${{ matrix.node }}
      - name: Restore pnpm cache
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: pnpm-sdk-browser-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sdk/browser/pnpm-lock.yaml') }}
          restore-keys: pnpm-sdk-browser-${{ runner.os }}-${{ runner.arch }}-
      - run: mise run --skip-tools ${{ matrix.task }}
        env:
          LO_SDK_NODE_VERSION: ${{ matrix.node }}
      - name: Save pnpm cache
        if: github.ref == 'refs/heads/main' && matrix.task == 'sdk-browser' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}

  # Python SDK：同一条 `mise run sdk-python` 按 LO_SDK_PYTHON_VERSION 在矩阵里跑（解释器由 uv 取，不用 setup-python）。
  # 3.9、3.13、3.15（GIL 构建）、3.15t（free-threaded）阻塞；3.16 预发布只为提前暴露 CPython 接口变化，
  # 红了不挡合并。持续剖析（ADR 0014）的真实采样只在 3.15t 上跑，其余格验证「开关打开只打 warning、不采集」，
  # 各格由测试按解释器能力自行 skip。
  # 3.9（最低支持 Python）与 3.13（默认基准 Python）额外在独立临时虚拟环境里用 `--resolution lowest-direct`
  # 回归最低直接依赖版本并校验生产依赖许可证白名单，不拖慢 3.15 / 3.15t / 3.16 变体。
  # continue-on-error 只许出现在这里，且只对 experimental 的 3.16 格为 true（check-github-workflows.sh 钉住）：
  # 带 continue-on-error 的失败格在 needs 里算 success，所以 ci-ok 不会因它变红。
  sdk-python:
    name: Python SDK (${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.sdk_python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.9"
            experimental: false
            lowest_direct: true
          - python: "3.13"
            experimental: false
            lowest_direct: true
          - python: "3.15"
            experimental: false
            lowest_direct: false
          - python: "3.15t"
            experimental: false
            lowest_direct: false
          - python: "3.16"
            experimental: true
            lowest_direct: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Calculate cache keys
        id: cache-keys
        run: bash scripts/ci-cache-keys.sh
      # 只读 base 工具集的缓存（uv 在里面），配 --skip-tools 避免装 Go/Node 等无关工具；保存由 base job 负责。
      - name: Restore mise cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-base-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.mise }}
          restore-keys: mise-base-${{ runner.os }}-${{ runner.arch }}-
      # uv 的包缓存（wheel、sdist、构建环境）；key 带矩阵里的解释器版本，各格互不覆盖，
      # restore-keys 只回退到同一解释器版本的旧缓存。
      - name: Restore uv cache
        id: uv-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-sdk-python-${{ runner.os }}-${{ runner.arch }}-${{ matrix.python }}-${{ hashFiles('sdk/python/pyproject.toml') }}
          restore-keys: uv-sdk-python-${{ runner.os }}-${{ runner.arch }}-${{ matrix.python }}-
      - name: Install mise toolchain
        run: bash scripts/ci-setup-mise.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_CI_PROFILE: sdk-python
      - run: mise run --skip-tools sdk-python
        env:
          LO_SDK_PYTHON_VERSION: ${{ matrix.python }}
      # 最低直接依赖回归：在独立临时 venv 中按 pyproject.toml 的 [tool.uv] exclude-newer（7 天）与
      # `--resolution lowest-direct` 解析直接依赖下界，避免污染 sdk/python/.venv。
      - name: Test Python SDK with lowest-direct dependencies
        if: matrix.lowest_direct
        shell: bash
        working-directory: sdk/python
        env:
          LO_SDK_PYTHON_VERSION: ${{ matrix.python }}
        run: |
          set -euo pipefail
          venv_dir=$(mktemp -d)
          trap 'rm -rf "$venv_dir"' EXIT
          mise x uv -- uv venv --managed-python --python "$LO_SDK_PYTHON_VERSION" --clear "$venv_dir"
          mise x uv -- uv pip install --python "$venv_dir/bin/python" --resolution lowest-direct -e ".[test]"
          "$venv_dir/bin/python" -VV
          "$venv_dir/bin/python" -m pytest -q tests
          bash ../../scripts/check-python-licenses.sh "$venv_dir/bin/python"
      - name: Save uv cache
        if: github.ref == 'refs/heads/main' && steps.uv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ steps.uv-cache.outputs.cache-primary-key }}

  # SDK journeys：起一个真实平台（带嵌入前端的二进制 + 外置 storage），对着它依次跑 Go、Node、Python、
  # Browser 四个 SDK 的 journey。任一语言工具链缺失都直接失败，不 skip。
  sdk-journeys:
    name: SDK journeys (Go, Node, Python, Browser)
    needs: changes
    if: needs.changes.outputs.sdk_journeys == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Calculate cache keys
        id: cache-keys
        run: bash scripts/ci-cache-keys.sh
      # mise-base 已包含 go/node/pnpm/jq/uv 及非 lazy 工具 rg，与 sdk-journeys 工具集一致，直接只读复用。
      - name: Restore mise cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-base-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.mise }}
          restore-keys: mise-base-${{ runner.os }}-${{ runner.arch }}-
      - name: Install mise toolchain
        run: bash scripts/ci-setup-mise.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_CI_PROFILE: sdk-journeys
      # Go 缓存只读：保存由 go job 负责（服务端构建同一份依赖）。
      - name: Restore Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ steps.cache-keys.outputs.go }}
          restore-keys: gomod-
      - name: Restore Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: gobuild-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.go-toolchain }}-${{ steps.cache-keys.outputs.go }}
          restore-keys: gobuild-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.go-toolchain }}-
      # web、sdk/node、sdk/browser 三个工作区已有各自独立缓存（由 web / sdk-node / sdk-browser 在 main 上保存）；
      # pnpm 12 使用单文件 SQLite 索引（~/.pnpm-store/v11/index.db），若依次恢复到同一目录会后盖前、丢掉前两份索引。
      # 因此每次恢复到 ~/.pnpm-store 后立即迁至独立目录，并通过 LO_PNPM_STORE_* 传给各工作区 `--store-dir`，
      # 实现全量只读复用且不再额外保存三锁合一的 pnpm-sdk-journeys-* 副本。
      - name: Restore pnpm cache (web)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: pnpm-web-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.pnpm-web }}
          restore-keys: pnpm-web-${{ runner.os }}-${{ runner.arch }}-
      - name: Isolate pnpm store (web)
        run: |
          rm -rf "$HOME/.pnpm-store-web"
          if [[ -d "$HOME/.pnpm-store" ]]; then
            mv "$HOME/.pnpm-store" "$HOME/.pnpm-store-web"
          else
            mkdir -p "$HOME/.pnpm-store-web"
          fi
          printf 'LO_PNPM_STORE_WEB=%s\n' "$HOME/.pnpm-store-web" >>"$GITHUB_ENV"
      - name: Restore pnpm cache (sdk-node)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: pnpm-sdk-node-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sdk/node/pnpm-lock.yaml') }}
          restore-keys: pnpm-sdk-node-${{ runner.os }}-${{ runner.arch }}-
      - name: Isolate pnpm store (sdk-node)
        run: |
          rm -rf "$HOME/.pnpm-store-sdk-node"
          if [[ -d "$HOME/.pnpm-store" ]]; then
            mv "$HOME/.pnpm-store" "$HOME/.pnpm-store-sdk-node"
          else
            mkdir -p "$HOME/.pnpm-store-sdk-node"
          fi
          printf 'LO_PNPM_STORE_SDK_NODE=%s\n' "$HOME/.pnpm-store-sdk-node" >>"$GITHUB_ENV"
      - name: Restore pnpm cache (sdk-browser)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: pnpm-sdk-browser-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sdk/browser/pnpm-lock.yaml') }}
          restore-keys: pnpm-sdk-browser-${{ runner.os }}-${{ runner.arch }}-
      - name: Isolate pnpm store (sdk-browser)
        run: |
          rm -rf "$HOME/.pnpm-store-sdk-browser"
          if [[ -d "$HOME/.pnpm-store" ]]; then
            mv "$HOME/.pnpm-store" "$HOME/.pnpm-store-sdk-browser"
          else
            mkdir -p "$HOME/.pnpm-store-sdk-browser"
          fi
          printf 'LO_PNPM_STORE_SDK_BROWSER=%s\n' "$HOME/.pnpm-store-sdk-browser" >>"$GITHUB_ENV"
      # storage-native 由 e2e(storage) 唯一保存，这里只读。
      - name: Restore storage archives cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/storage-bin/.archives
          key: storage-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.storage }}
          restore-keys: storage-native-${{ runner.os }}-${{ runner.arch }}-
      # Playwright 浏览器按 sdk/browser/pnpm-lock.yaml 解析出的 playwright-core 精确版本缓存，
      # 不设跨版本 restore-keys，避免升级后旧版 Chromium 残留且无关依赖改动不再重复保存。
      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-sdk-journeys-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.playwright-sdk-browser }}
      # sdk_journeys_only 为空 = 四个 journey 都跑；否则是空格分隔的语言列表（只改 web/ 或单个 SDK 时收窄）。
      - run: mise run sdk-journeys
        env:
          LO_SDK_JOURNEYS_ONLY: ${{ needs.changes.outputs.sdk_journeys_only }}
      - name: Save Playwright browser cache
        if: github.ref == 'refs/heads/main' && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

  # Trivy 的 sha256 只在 release.yml 的扫描里用到，PR CI 其它 job 不会校验它；scripts/install-trivy.sh 改动时在这里
  # 在两个架构上各真下载一次并 sha256sum --check（脚本按 uname -m 选 sha）。Renovate 的 trivy 组只改 trivy_version，
  # 两个 sha 由 agent 从 release 的 *_checksums.txt 补（.agents/docs/plans/renovate.md），可能漏补或只补错一个架构，
  # 所以两个架构都要跑：版本与 sha 错配（sha 还没补、补错）就在 PR 里变红。
  # 不查 GitHub API、不算发布年龄（那是 Renovate 的 minimumReleaseAge），不需要 token 和 mise。
  trivy-pin:
    name: Trivy pin (linux/${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.trivy_pin == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Trivy and verify its sha256
        run: bash scripts/install-trivy.sh

  docs:
    name: Docs site (Zensical)
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Calculate cache keys
        id: cache-keys
        run: bash scripts/ci-cache-keys.sh
      # 只读复用 base 的 mise 缓存（uv 在里面），配 --skip-tools 避免安装无关工具。
      - name: Restore mise cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-base-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.mise }}
          restore-keys: mise-base-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore uv cache
        id: uv-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-docs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/docs/pyproject.toml') }}
          restore-keys: uv-docs-${{ runner.os }}-${{ runner.arch }}-
      - name: Install mise toolchain
        run: bash scripts/ci-setup-mise.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_CI_TOOLS: uv
      - run: mise run --skip-tools docs-build
      - name: Save uv cache
        if: github.ref == 'refs/heads/main' && steps.uv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ steps.uv-cache.outputs.cache-primary-key }}

  # 唯一的 required check。被跳过的 job 算通过；任一 job 失败或被取消则失败。
  ci-ok:
    # check 名必须就是 ci-ok：分支保护按这个名字匹配 required check。
    name: ci-ok
    if: always()
    needs:
      - changes
      - go
      - go-cross
      - artifact-smoke
      - e2e
      - e2e-restart
      - e2e-ha
      - web
      - meta-pg
      - sdk-go
      - sdk-node
      - sdk-browser
      - sdk-python
      - sdk-journeys
      - trivy-pin
      - docs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed or be skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          printf 'job results: %s\n' "$RESULTS"
          for result in $RESULTS; do
            case "$result" in
            success | skipped) ;;
            *)
              printf 'a required job ended with %s\n' "$result" >&2
              exit 1
              ;;
            esac
          done
