name: CI

# 增量 CI：changes 作业按改动面输出布尔标志（scripts/ci-changes.sh），各业务 job 按标志
# 决定跑还是跳过；最后的 ci-ok 汇总 job 是唯一的 required check，被跳过的 job 算通过。
# 纯文档改动所有业务 job 跳过。动到打包链路时 arm64 构建与冒烟进入 build 矩阵，
# 发版前 release.yml 再对两个架构兜底。服务端改动另跑多副本 HA 功能门禁（e2e-ha）；
# SDK、服务端与前端改动另跑 SDK journeys（真实平台 + Go/Node/Python/Browser 四个 SDK 的端到端 journey）；
# 性能门禁（perf-ha、perf-release、bench）不进 PR，只在 bench.yml 手动和 release.yml 发版前跑。
#
# 所有 job 直接跑在 GitHub 托管 runner 上，工具由 scripts/ci-setup-mise.sh 安装，mise 目录按 job 缓存。
#
# 切片分支只靠 pull_request 跑一遍；push 只留给合并后的 main 和 integration 分支。
on:
  push:
    branches:
      - main
      - "integration/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# mise 在 job 中途按需安装 task 工具时也要带 token，否则 GitHub API 匿名限流会让安装 403。
env:
  MISE_GITHUB_TOKEN: ${{ github.token }}

jobs:
  changes:
    name: Detect change surface
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      go: ${{ steps.detect.outputs.go }}
      build: ${{ steps.detect.outputs.build }}
      e2e: ${{ steps.detect.outputs.e2e }}
      ha: ${{ steps.detect.outputs.ha }}
      web: ${{ steps.detect.outputs.web }}
      meta_pg: ${{ steps.detect.outputs.meta_pg }}
      arm64: ${{ steps.detect.outputs.arm64 }}
      sdk_go: ${{ steps.detect.outputs.sdk_go }}
      sdk_node: ${{ steps.detect.outputs.sdk_node }}
      sdk_browser: ${{ steps.detect.outputs.sdk_browser }}
      sdk_python: ${{ steps.detect.outputs.sdk_python }}
      sdk_journeys: ${{ steps.detect.outputs.sdk_journeys }}
      sdk_journeys_only: ${{ steps.detect.outputs.sdk_journeys_only }}
      pins: ${{ steps.detect.outputs.pins }}
      build_matrix: ${{ steps.detect.outputs.build_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect change surface
        id: detect
        run: bash scripts/ci-changes.sh
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_BEFORE_SHA: ${{ github.event.before }}

  go:
    name: Go, licenses, Helm
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Calculate cache keys
        id: cache-keys
        run: bash scripts/ci-cache-keys.sh
      - name: Restore mise cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}
          restore-keys: mise-go-${{ runner.os }}-${{ runner.arch }}-
      - name: Install mise toolchain
        run: bash scripts/ci-setup-mise.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_CI_PROFILE: go-ci
      - name: Restore Go cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.mise }}-${{ steps.cache-keys.outputs.go }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-
      - run: mise run workflow-check
      - run: mise run install-check
      - run: mise run release-prerequisites-test
      - run: mise run migration-check
      - run: mise run ent-generate-check
      - run: mise run license-check
      # 服务端模块与 sdk/go 的可达漏洞；漏洞库运行时从 vuln.go.dev 拉取，新公告可能让无关 PR 变红。
      - run: mise run vulncheck
      - run: mise run fmt-check
      - run: mise run mod-tidy-check
      - run: mise run lint
      - run: mise run vet
      - run: mise run test
      - run: mise run helm-lint
      - run: mise run helm-template-test

  go-cross:
    name: Go build (linux/${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Calculate cache keys
        id: cache-keys
        run: bash scripts/ci-cache-keys.sh
      - name: Restore mise cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-go-cross-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}
          restore-keys: mise-go-cross-${{ runner.os }}-${{ runner.arch }}-
      - name: Install mise toolchain
        run: bash scripts/ci-setup-mise.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Restore Go cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.mise }}-${{ steps.cache-keys.outputs.go }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: pnpm-web-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.mise }}-${{ steps.cache-keys.outputs.pnpm-web }}
          restore-keys: pnpm-web-${{ runner.os }}-${{ runner.arch }}-
      - name: Build real embedded artifact
        run: mise run dist
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          BINARY: .cache/build/linux-${{ matrix.arch }}/lazy-observe
      - name: Record embedded artifact evidence
        run: mise x go -- bash scripts/check-embedded-artifact.sh ".cache/build/linux-${{ matrix.arch }}/lazy-observe" "linux/${{ matrix.arch }}"
        env:
          LO_ARTIFACT_EVIDENCE: .cache/artifact-evidence/linux-${{ matrix.arch }}.json

  artifact-smoke:
    name: Zero-config artifact smoke (linux/${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Docker access
        run: bash scripts/ci-setup-docker.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # 不用默认的 moby/buildkit:buildx-stable-1：按具体版本 + 多架构 index digest 固定。
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - name: Build loadable zero-config artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker buildx build \
            --platform "linux/${{ matrix.arch }}" \
            --load \
            --provenance=false \
            --sbom=false \
            --secret "id=github_token,env=GITHUB_TOKEN" \
            --tag "lazy-observe:ci-${{ matrix.arch }}" \
            .
      - name: Smoke real embedded artifact
        run: bash scripts/check-container-smoke.sh "lazy-observe:ci-${{ matrix.arch }}" "linux/${{ matrix.arch }}"

  # 网关 e2e 大多在等固定观察窗口（自监控 70s、静默告警 50s 等），串行要 6 分钟以上，
  # 所以按测试分到并行分片；check-e2e-contract.sh 校验分片的并集正好是全集。
  e2e:
    name: Gateway E2E (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: storage
            gateway_tests: "StorageGateway"
          - shard: self-monitoring
            gateway_tests: "SelfMonitoringDisabled"
          - shard: alerts-scrape-tls
            gateway_tests: "LogsAlert|ScrapeManagement|NativeTLSLoopback"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Calculate cache keys
        id: cache-keys
        run: bash scripts/ci-cache-keys.sh
      - name: Restore mise cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-e2e-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}
          restore-keys: mise-e2e-${{ runner.os }}-${{ runner.arch }}-
      - name: Install mise toolchain
        run: bash scripts/ci-setup-mise.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Restore Go cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.mise }}-${{ steps.cache-keys.outputs.go }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/storage-bin/.archives
          key: storage-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.storage }}
          restore-keys: storage-native-${{ runner.os }}-${{ runner.arch }}-
      - run: mise run e2e
        env:
          LO_E2E_GATEWAY_TESTS: ${{ matrix.gateway_tests }}

  e2e-restart:
    name: Gateway same-data-dir restart fixture
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Calculate cache keys
        id: cache-keys
        run: bash scripts/ci-cache-keys.sh
      - name: Restore mise cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-e2e-restart-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}
          restore-keys: mise-e2e-restart-${{ runner.os }}-${{ runner.arch }}-
      - name: Install mise toolchain
        run: bash scripts/ci-setup-mise.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Restore Go cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.mise }}-${{ steps.cache-keys.outputs.go }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/storage-bin/.archives
          key: storage-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.storage }}
          restore-keys: storage-native-${{ runner.os }}-${{ runner.arch }}-
      - run: mise run e2e-restart

  # 多副本 HA 功能门禁：双副本网关 + VM 集群（含一个 vmstorage 掉线）、VLogs/VTraces 分角色、
  # SeaweedFS S3、Postgres 告警租约与 Outbox、Valkey 会话。只跑功能断言（不设 LO_E2E_PERF_GATES），
  # 性能部分留给 bench.yml / release.yml 的 perf-ha。依赖缺失时脚本以 77 退出，在 CI 里算失败。
  e2e-ha:
    name: HA E2E (multi-replica)
    needs: changes
    if: needs.changes.outputs.ha == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Docker access
        run: bash scripts/ci-setup-docker.sh
      - name: Calculate cache keys
        id: cache-keys
        run: bash scripts/ci-cache-keys.sh
      - name: Restore mise cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-e2e-ha-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}
          restore-keys: mise-e2e-ha-${{ runner.os }}-${{ runner.arch }}-
      - name: Install mise toolchain
        run: bash scripts/ci-setup-mise.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Restore Go cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.mise }}-${{ steps.cache-keys.outputs.go }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/storage-bin/.archives
          key: storage-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.storage }}
          restore-keys: storage-native-${{ runner.os }}-${{ runner.arch }}-
      - run: mise run e2e-ha

  web:
    name: Web typecheck and build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Calculate cache keys
        id: cache-keys
        run: bash scripts/ci-cache-keys.sh
      - name: Restore mise cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-web-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}
          restore-keys: mise-web-${{ runner.os }}-${{ runner.arch }}-
      - name: Install mise toolchain
        run: bash scripts/ci-setup-mise.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Restore pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: pnpm-web-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.mise }}-${{ steps.cache-keys.outputs.pnpm-web }}
          restore-keys: pnpm-web-${{ runner.os }}-${{ runner.arch }}-
      - run: mise run web

  meta-pg:
    name: PostgreSQL metadata tests
    needs: changes
    if: needs.changes.outputs.meta_pg == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Calculate cache keys
        id: cache-keys
        run: bash scripts/ci-cache-keys.sh
      - name: Restore mise cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-meta-pg-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.mise }}
          restore-keys: mise-meta-pg-${{ runner.os }}-${{ runner.arch }}-
      - name: Install mise toolchain
        run: bash scripts/ci-setup-mise.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_CI_PROFILE: meta-pg
      - name: Restore Go cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-meta-pg-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.mise }}-${{ steps.cache-keys.outputs.go }}
          restore-keys: go-meta-pg-${{ runner.os }}-${{ runner.arch }}-
      # embedded-postgres 从 Maven Central 下载 Postgres 归档；共享 runner 出口 IP 被限流时
      # 下载会以 403/429/5xx 失败，库却只报 "no version found matching 18.3.0"。
      # 把归档目录（mise 的 test-meta-pg 任务默认用 $HOME/.cache/embedded-postgres）缓存起来，
      # 命中时不再联网。key 固定 runner os/arch、库版本（来自 go.mod）和归档版本 18.3.0
      # （embedded-postgres 的 V18，即 DefaultConfig 的默认版本），升级库或换 PG 版本时一起改。
      - name: Resolve embedded Postgres module version
        id: embedded-pg
        run: |
          module=$(awk '$1 == "github.com/fergusstrange/embedded-postgres" { print $2 }' go.mod)
          if [[ -z $module ]]; then
            printf 'embedded-postgres is missing from go.mod\n' >&2
            exit 1
          fi
          printf 'module=%s\n' "$module" >>"$GITHUB_OUTPUT"
      - name: Restore embedded Postgres archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/embedded-postgres
          key: embedded-pg-${{ runner.os }}-${{ runner.arch }}-18.3.0-${{ steps.embedded-pg.outputs.module }}
          restore-keys: embedded-pg-${{ runner.os }}-${{ runner.arch }}-18.3.0-
      - name: Run PostgreSQL tests when migrations exist
        run: mise run --skip-tools test-meta-pg

  sdk-go:
    name: Go SDK (build, vet, lint, test)
    needs: changes
    if: needs.changes.outputs.sdk_go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Calculate cache keys
        id: cache-keys
        run: bash scripts/ci-cache-keys.sh
      - name: Restore mise cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-sdk-go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}
          restore-keys: mise-sdk-go-${{ runner.os }}-${{ runner.arch }}-
      - name: Install mise toolchain
        run: bash scripts/ci-setup-mise.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Restore Go cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-sdk-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.mise }}-${{ steps.cache-keys.outputs.go }}
          restore-keys: go-sdk-${{ runner.os }}-${{ runner.arch }}-
      - run: mise run sdk-go

  sdk-node:
    name: Node SDK (install, build, typecheck, test, licenses)
    needs: changes
    if: needs.changes.outputs.sdk_node == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore mise cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-sdk-node-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}
          restore-keys: mise-sdk-node-${{ runner.os }}-${{ runner.arch }}-
      - name: Install mise toolchain
        run: bash scripts/ci-setup-mise.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Restore pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: pnpm-sdk-node-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'sdk/node/pnpm-lock.yaml') }}
          restore-keys: pnpm-sdk-node-${{ runner.os }}-${{ runner.arch }}-
      - run: mise run sdk-node

  sdk-browser:
    name: Browser SDK (install, build, typecheck, test, licenses)
    needs: changes
    if: needs.changes.outputs.sdk_browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore mise cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-sdk-browser-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}
          restore-keys: mise-sdk-browser-${{ runner.os }}-${{ runner.arch }}-
      - name: Install mise toolchain
        run: bash scripts/ci-setup-mise.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Restore pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: pnpm-sdk-browser-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'sdk/browser/pnpm-lock.yaml') }}
          restore-keys: pnpm-sdk-browser-${{ runner.os }}-${{ runner.arch }}-
      - run: mise run sdk-browser

  sdk-python:
    name: Python SDK (install, pytest)
    needs: changes
    if: needs.changes.outputs.sdk_python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore mise cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-sdk-python-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}
          restore-keys: mise-sdk-python-${{ runner.os }}-${{ runner.arch }}-
      - name: Install mise toolchain
        run: bash scripts/ci-setup-mise.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_CI_PROFILE: sdk-python
      - run: mise run sdk-python

  # SDK journeys：起一个真实平台（带嵌入前端的二进制 + 外置 storage），对着它依次跑 Go、Node、Python、
  # Browser 四个 SDK 的 journey。任一语言工具链缺失都直接失败，不 skip。
  sdk-journeys:
    name: SDK journeys (Go, Node, Python, Browser)
    needs: changes
    if: needs.changes.outputs.sdk_journeys == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Calculate cache keys
        id: cache-keys
        run: bash scripts/ci-cache-keys.sh
      - name: Restore mise cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-sdk-journeys-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}
          restore-keys: mise-sdk-journeys-${{ runner.os }}-${{ runner.arch }}-
      - name: Install mise toolchain
        run: bash scripts/ci-setup-mise.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_CI_PROFILE: sdk-journeys
      - name: Restore Go cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-sdk-journeys-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.mise }}-${{ steps.cache-keys.outputs.go }}
          restore-keys: go-sdk-journeys-${{ runner.os }}-${{ runner.arch }}-
      # web、sdk/node、sdk/browser 三个 pnpm 工作区共用一个内容寻址 store。
      - name: Restore pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: pnpm-sdk-journeys-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'web/pnpm-lock.yaml', 'sdk/node/pnpm-lock.yaml', 'sdk/browser/pnpm-lock.yaml') }}
          restore-keys: pnpm-sdk-journeys-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/storage-bin/.archives
          key: storage-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.storage }}
          restore-keys: storage-native-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-sdk-journeys-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sdk/browser/pnpm-lock.yaml') }}
          restore-keys: playwright-sdk-journeys-${{ runner.os }}-${{ runner.arch }}-
      # sdk_journeys_only 为空 = 四个 journey 都跑；否则是空格分隔的语言列表（只改 web/ 或单个 SDK 时收窄）。
      - run: mise run sdk-journeys
        env:
          LO_SDK_JOURNEYS_ONLY: ${{ needs.changes.outputs.sdk_journeys_only }}

  # 手工固定点（Victoria、mise、Trivy 等 GitHub release 版本）的最小发布年龄门禁：Dependabot 看不到这些固定点，
  # 它们的 cooldown 要靠这里兜底。只在固定点文件变化时跑（scripts/ci-changes.sh 的 pins 标志）。
  # 要联网查 GitHub API，所以不放进离线的 workflow-check；runner 自带 curl 和 jq，不需要 mise。
  # 每周的新版本报告在 pinned-releases.yml。
  pinned-releases:
    name: Pinned releases (minimum release age)
    needs: changes
    if: needs.changes.outputs.pins == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Gate pinned release age
        run: bash scripts/check-pinned-releases.sh --gate
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # 唯一的 required check。被跳过的 job 算通过；任一 job 失败或被取消则失败。
  ci-ok:
    # check 名必须就是 ci-ok：分支保护按这个名字匹配 required check。
    name: ci-ok
    if: always()
    needs:
      - changes
      - go
      - go-cross
      - artifact-smoke
      - e2e
      - e2e-restart
      - e2e-ha
      - web
      - meta-pg
      - sdk-go
      - sdk-node
      - sdk-browser
      - sdk-python
      - sdk-journeys
      - pinned-releases
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed or be skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          printf 'job results: %s\n' "$RESULTS"
          for result in $RESULTS; do
            case "$result" in
            success | skipped) ;;
            *)
              printf 'a required job ended with %s\n' "$result" >&2
              exit 1
              ;;
            esac
          done
