{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lazy-observe.fullname" . }}
  labels:
    {{- include "lazy-observe.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secret.keys.postgresURL }}: {{ default .Values.external.postgres.url .Values.secret.values.postgresURL | quote }}
  {{ .Values.secret.keys.redisPassword }}: {{ .Values.secret.values.redisPassword | quote }}
  {{ .Values.secret.keys.s3AccessKey }}: {{ .Values.secret.values.s3AccessKey | quote }}
  {{ .Values.secret.keys.s3SecretKey }}: {{ .Values.secret.values.s3SecretKey | quote }}
{{- end }}
