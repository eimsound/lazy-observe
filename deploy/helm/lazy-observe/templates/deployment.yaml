{{- if and (ne .Values.mode "standalone-ha") (ne .Values.mode "allinone") }}{{ fail "mode must be standalone-ha or allinone" }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lazy-observe.fullname" . }}
  labels:
    {{- include "lazy-observe.labels" . | nindent 4 }}
spec:
  {{- if or (eq .Values.mode "allinone") (not .Values.hpa.enabled) }}
  replicas: {{ if eq .Values.mode "allinone" }}1{{ else }}{{ .Values.replicaCount }}{{ end }}
  {{- end }}
  strategy:
    type: {{ if eq .Values.mode "allinone" }}Recreate{{ else }}RollingUpdate{{ end }}
  selector:
    matchLabels:
      {{- include "lazy-observe.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{ end }}
      labels:
        {{- include "lazy-observe.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{ end }}
    spec:
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: lazy-observe
          image: {{ include "lazy-observe.image" . | quote }}
          imagePullPolicy: {{ include "lazy-observe.imagePullPolicy" . }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args: ["server", "--config", "/etc/lazy-observe/config.yaml"]
          ports:
            - name: http
              containerPort: 3100
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            preStop:
              exec:
                command: ["/usr/local/bin/lazy-observe", "pre-stop", "--delay", {{ .Values.process.preStopDelay | quote }}]
          {{- if eq .Values.mode "standalone-ha" }}
          env:
            - name: LO_META_DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "lazy-observe.secretName" . }}
                  key: {{ .Values.secret.keys.postgresURL }}
            - name: LO_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "lazy-observe.secretName" . }}
                  key: {{ .Values.secret.keys.redisPassword }}
                  optional: true
            - name: LO_BLOB_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "lazy-observe.secretName" . }}
                  key: {{ .Values.secret.keys.s3AccessKey }}
                  optional: true
            - name: LO_BLOB_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "lazy-observe.secretName" . }}
                  key: {{ .Values.secret.keys.s3SecretKey }}
                  optional: true
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/lazy-observe
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            {{- if include "lazy-observe.encryptionKey.mounted" . }}
            - name: encryption-key
              mountPath: {{ include "lazy-observe.encryptionKey.mountPath" . }}
              readOnly: true
            {{- end }}
            {{- if include "lazy-observe.adminPassword.mounted" . }}
            - name: admin-password
              mountPath: {{ include "lazy-observe.adminPassword.mountPath" . }}
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "lazy-observe.fullname" . }}
        {{- if and (eq .Values.mode "allinone") .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "lazy-observe.fullname" . }}
        {{- else }}
        - name: data
          emptyDir:
            {{- with .Values.emptyDir.dataSizeLimit }}
            sizeLimit: {{ . }}
            {{- end }}
        {{- end }}
        - name: tmp
          emptyDir:
            {{- with .Values.emptyDir.tmpSizeLimit }}
            sizeLimit: {{ . }}
            {{- end }}
        {{- if include "lazy-observe.encryptionKey.mounted" . }}
        - name: encryption-key
          secret:
            secretName: {{ include "lazy-observe.encryptionKey.secretName" . }}
            # 0444: Secret files are root-owned and the image runs as the
            # distroless nonroot uid 65532; the tmpfs is private to this pod.
            defaultMode: 0444
            items:
              - key: {{ .Values.encryptionKey.key }}
                path: secret.key
        {{- end }}
        {{- if include "lazy-observe.adminPassword.mounted" . }}
        - name: admin-password
          secret:
            secretName: {{ include "lazy-observe.adminPassword.secretName" . }}
            # Same 0444 reasoning as the encryption key: root-owned Secret
            # files, nonroot uid 65532, pod-private tmpfs.
            defaultMode: 0444
            items:
              - key: {{ .Values.adminPassword.key }}
                path: admin-password
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity: {{ toYaml .Values.affinity | nindent 8 }}
      {{- else if eq .Values.podAntiAffinity "soft" }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "lazy-observe.selectorLabels" . | nindent 20 }}
      {{- else if eq .Values.podAntiAffinity "hard" }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "lazy-observe.selectorLabels" . | nindent 18 }}
      {{- else if .Values.podAntiAffinity }}
      {{- fail (printf "podAntiAffinity must be \"\", \"soft\", or \"hard\", got %q" .Values.podAntiAffinity) }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        - maxSkew: {{ .maxSkew }}
          topologyKey: {{ .topologyKey | quote }}
          whenUnsatisfiable: {{ .whenUnsatisfiable | quote }}
          {{- if .minDomains }}
          minDomains: {{ .minDomains }}
          {{- end }}
          {{- if .nodeAffinityPolicy }}
          nodeAffinityPolicy: {{ .nodeAffinityPolicy | quote }}
          {{- end }}
          {{- if .nodeTaintsPolicy }}
          nodeTaintsPolicy: {{ .nodeTaintsPolicy | quote }}
          {{- end }}
          {{- with .matchLabelKeys }}
          matchLabelKeys: {{ toYaml . | nindent 12 }}
          {{- end }}
          labelSelector:
            {{- if .labelSelector }}
            {{- toYaml .labelSelector | nindent 12 }}
            {{- else }}
            matchLabels:
              {{- include "lazy-observe.selectorLabels" $ | nindent 14 }}
            {{- end }}
        {{- end }}
      {{- end }}
