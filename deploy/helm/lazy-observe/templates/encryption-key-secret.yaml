{{- if eq (include "lazy-observe.encryptionKey.source" .) "generated" }}
{{- $name := include "lazy-observe.encryptionKey.secretName" . }}
{{- $key := .Values.encryptionKey.key }}
{{- /*
Reuse the key already stored in the cluster so `helm upgrade` never rotates it.
lookup returns an empty map under `helm template`, client-side `--dry-run`, and
GitOps renderers without cluster access; such renders print a fresh random key.
*/ -}}
{{- $current := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $value := "" }}
{{- if $current }}
{{- $value = dig "data" $key "" $current }}
{{- if not $value }}
{{- fail (printf "encryptionKey: Secret %s exists but has no key %q; restore it or set encryptionKey.key to the stored key name (the chart never replaces an existing platform encryption key)" $name $key) }}
{{- end }}
{{- else }}
{{- /* 32 random bytes as unpadded standard base64, without a trailing newline. */ -}}
{{- $value = randBytes 32 | trimSuffix "=" | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "lazy-observe.labels" . | nindent 4 }}
  annotations:
    # Keep the key on `helm uninstall` and when a later revision stops
    # rendering this Secret: losing it makes every sealed value unreadable.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $key }}: {{ $value | quote }}
{{- end }}
