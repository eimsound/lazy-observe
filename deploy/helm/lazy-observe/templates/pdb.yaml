{{- if and .Values.podDisruptionBudget.enabled (eq .Values.mode "standalone-ha") -}}
{{- $effectiveReplicas := int (ternary .Values.hpa.minReplicas .Values.replicaCount .Values.hpa.enabled) -}}
{{- $minAvailStr := toString .Values.podDisruptionBudget.minAvailable -}}
{{- $render := false -}}
{{- if gt $effectiveReplicas 1 -}}
  {{- if hasSuffix "%" $minAvailStr -}}
    {{- $render = true -}}
  {{- else if gt $effectiveReplicas (int .Values.podDisruptionBudget.minAvailable) -}}
    {{- $render = true -}}
  {{- end -}}
{{- end -}}
{{- if $render }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "lazy-observe.fullname" . }}
  labels:
    {{- include "lazy-observe.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "lazy-observe.selectorLabels" . | nindent 6 }}
{{- end }}
{{- end }}

