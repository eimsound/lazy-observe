{{- if eq (include "lazy-observe.adminPassword.source" .) "generated" }}
{{- $name := include "lazy-observe.adminPassword.secretName" . }}
{{- $key := .Values.adminPassword.key }}
{{- /*
Reuse the password already stored in the cluster so `helm upgrade` never
rotates the value the operator reads back. lookup returns an empty map under
`helm template`, client-side `--dry-run`, and GitOps renderers without cluster
access; such renders print a fresh random password.
*/ -}}
{{- $current := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $value := "" }}
{{- if $current }}
{{- $value = dig "data" $key "" $current }}
{{- if not $value }}
{{- fail (printf "adminPassword: Secret %s exists but has no key %q; restore it or set adminPassword.key to the stored key name (the chart never replaces an existing admin password Secret)" $name $key) }}
{{- end }}
{{- else }}
{{- /* 32 random alphanumeric characters, without a trailing newline. */ -}}
{{- $value = randAlphaNum 32 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "lazy-observe.labels" . | nindent 4 }}
  annotations:
    # Keep the password on `helm uninstall` and when a later revision stops
    # rendering this Secret, so a reinstall against the same database still
    # documents the bootstrap password.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $key }}: {{ $value | quote }}
{{- end }}
