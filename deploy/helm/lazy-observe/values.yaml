mode: standalone-ha
replicaCount: 2

image:
  repository: ghcr.io/eimsound/lazy-observe
  # Empty falls back to Chart.AppVersion ("latest" for the in-repo chart), so
  # pin a released version instead of relying on the default.
  tag: ""
  # Optional registry digest of the image: "sha256:" followed by 64 lowercase
  # hex characters. When set, the container image is rendered as
  # <repository>[:<tag>]@<digest>, so the digest - not the tag - selects the
  # bytes that run; a malformed digest fails rendering instead of silently
  # falling back to a mutable tag. Every GitHub Release of the server ships
  # helm-values-lazy-observe-<version>.yaml with this field filled in from the
  # image the release published (see docs/deployment.md).
  digest: ""
  # Leave empty to use Always when running the mutable :latest tag without a
  # digest, and IfNotPresent for any pinned tag or digest.
  pullPolicy: ""
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

meta:
  migrationLockTimeout: 60s

service:
  type: ClusterIP
  port: 3100

ingress:
  enabled: false
  className: ""
  # Reference annotations for nginx-ingress when serving OTLP/source-map uploads
  # (up to 52 MiB) and Live Tail SSE streams over HTTPS:
  #   nginx.ingress.kubernetes.io/proxy-body-size: "52m"
  #   nginx.ingress.kubernetes.io/proxy-buffering: "off"
  #   nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  #   nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  annotations: {}
  hosts:
    - host: lazy-observe.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Public console base URL used for clickable links in alert notifications
# (e.g. "https://observe.example.com"). Empty disables notification links.
externalURL: ""

external:
  postgres:
    url: "postgres://lazy_observe:change-me@postgresql:5432/lazy_observe?sslmode=require"
  redis:
    addr: "redis:6379"
    db: 0
    keyPrefix: lazy-observe
  s3:
    bucket: lazy-observe
    region: us-east-1
    endpoint: ""
  metrics:
    kind: vm
    # Set cluster=true when queryURL points to vmselect and ingestURL points to
    # vminsert. tenantAccountID becomes the platform-level VM account.
    cluster: false
    tenantAccountID: "0"
    queryURL: "http://victoria-metrics:8428"
    ingestURL: "http://victoria-metrics:8428"
  logs:
    # For a split cluster this URL must be a path-aware vmauth/Service that
    # routes /insert/* to vlinsert and /select/* to vlselect.
    url: "http://victoria-logs:9428"
  traces:
    # For a split cluster this URL must be a path-aware vmauth/Service that
    # routes /insert/* to vtinsert and /select/* to vtselect.
    url: "http://victoria-traces:10428"

secret:
  # Set existingSecret in production. It must contain the keys named below.
  existingSecret: ""
  keys:
    postgresURL: postgres-url
    redisPassword: redis-password
    s3AccessKey: s3-access-key
    s3SecretKey: s3-secret-key
  create: false
  values:
    postgresURL: ""
    redisPassword: ""
    s3AccessKey: ""
    s3SecretKey: ""

# Platform encryption key (server: security.secret_key_file). It seals
# sensitive metadata such as the AI provider API key and derives internal
# tokens, so every replica must read the same key and it must outlive pods.
# The chart mounts it read-only at /etc/lazy-observe-key/secret.key; it is
# never passed through environment variables.
encryptionKey:
  # Secret you manage (kubectl, Sealed Secrets, External Secrets). The value is
  # 32 random bytes as standard base64, padded or not; a trailing newline is
  # fine. Example:
  #   kubectl create secret generic lazy-observe-encryption-key \
  #     --from-literal=secret.key="$(openssl rand -base64 32)"
  # Required for Argo CD, `helm template | kubectl apply`, or any renderer
  # without cluster access (see autoGenerate). Back the value up: losing it
  # makes stored secrets unrecoverable.
  existingSecret: ""
  # Key inside the Secret (existing or generated) that holds the value.
  key: secret.key
  # Without existingSecret, create <fullname>-encryption-key on first install.
  # `helm upgrade` reuses the stored value through `lookup`, and the Secret
  # carries helm.sh/resource-policy: keep so `helm uninstall` leaves it behind
  # (a reinstall with the same release name and namespace adopts it again).
  # `lookup` sees no cluster under `helm template`, client-side `--dry-run`,
  # or Argo CD, so those renders contain a new random key every time: use
  # existingSecret there. Flux helm-controller installs with cluster access.
  # Set false to require existingSecret: standalone-ha then always fails
  # rendering, even with one replica, because /data is an emptyDir while the
  # metadata database is external - a key generated there dies with the pod and
  # the next pod is refused for a fingerprint mismatch. allinone with
  # persistence keeps the key in its PVC data_dir unless existingSecret is set;
  # allinone without a PVC loses key and database together, so it may fall back
  # to data_dir.
  autoGenerate: true

# First admin password (server: security.admin_password_file). It is read only
# while the admin account does not exist yet; later password changes happen in
# the UI and never touch this Secret. The chart mounts it read-only at
# /etc/lazy-observe-admin/admin-password; it is never passed through
# environment variables. Without a Secret the server generates a random
# password, writes it to <data_dir>/initial-admin-password (0600) on the one
# replica that creates the admin, and forces a change on first login.
adminPassword:
  # Secret you manage. The value needs at least 8 characters; surrounding
  # whitespace and a trailing newline are ignored. Example:
  #   kubectl create secret generic lazy-observe-admin-password \
  #     --from-literal=admin-password="$(openssl rand -base64 24)"
  # A password you provide is treated as chosen by you and is not forced to
  # change on first login.
  existingSecret: ""
  # Key inside the Secret (existing or generated) that holds the value.
  key: admin-password
  # Without existingSecret, create <fullname>-admin-password (32 random
  # alphanumeric characters) on first install so every replica reads the same
  # password and it survives pod restarts; read it back with the command in
  # NOTES. Same lookup/keep rules as encryptionKey.autoGenerate: `helm
  # template`, client-side `--dry-run`, and Argo CD render a new value every
  # time, so use existingSecret there. Anyone allowed to read Secrets in the
  # namespace can read this password until you change it in the UI.
  # Set false to require existingSecret: rendering then fails when
  # standalone-ha runs more than one replica (replicaCount > 1 or HPA). A
  # single replica then falls back to the server-generated
  # <data_dir>/initial-admin-password file; the distroless image has no shell,
  # so reading it needs `kubectl debug` (see NOTES).
  autoGenerate: true

security:
  # Mark session and CSRF cookies Secure. Enable when TLS terminates at an
  # Ingress or reverse proxy in front of lazy-observe.
  sessionSecureCookie: false

automountServiceAccountToken: false

# Defaults comply with Kubernetes Pod Security Standards "restricted" and match
# the distroless nonroot UID/GID (65532:65532) so block-storage PVCs mounted at
# /data are writable without EACCES.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

emptyDir:
  dataSizeLimit: 1Gi
  tmpSizeLimit: 256Mi

process:
  startupTimeout: 20s
  shutdownTimeout: 15s
  drainTimeout: 20s
  preStopDelay: 5s
terminationGracePeriodSeconds: 45

resources:
  requests:
    cpu: 250m
    memory: 512Mi
    ephemeral-storage: 256Mi
  limits:
    cpu: "2"
    memory: 2Gi
    ephemeral-storage: 2Gi

hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

persistence:
  enabled: true
  accessModes: [ReadWriteOnce]
  size: 20Gi
  storageClass: ""

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
# Built-in podAntiAffinity preset used when `affinity` is empty:
# "" (disabled), "soft" (preferred), or "hard" (required). Scoped by both
# app.kubernetes.io/name and app.kubernetes.io/instance.
podAntiAffinity: ""
affinity: {}
# Optional Pod topologySpreadConstraints. When an entry omits `labelSelector`,
# the chart binds it automatically to this release's selectorLabels
# (app.kubernetes.io/name + app.kubernetes.io/instance).
topologySpreadConstraints: []
