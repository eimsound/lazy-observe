# Production-oriented standalone-ha profile. The chart deploys only the
# lazy-observe gateway; PostgreSQL, Redis, S3 and the three signal clusters are
# external services reachable on the Kubernetes network.
mode: standalone-ha
replicaCount: 3

external:
  postgres:
    url: "postgres://lazy_observe:change-me@postgresql:5432/lazy_observe?sslmode=require"
  redis:
    addr: "redis-master:6379"
    db: 0
    keyPrefix: lazy-observe
  # Shared Replay/source-map/profile blob storage. These values configure
  # lazy-observe only; signal clusters keep active data on separately
  # provisioned vmstorage/vlstorage/vtstorage persistent volumes.
  s3:
    bucket: lazy-observe
    region: us-east-1
    endpoint: "http://seaweedfs-s3.storage.svc:8333"
  metrics:
    kind: vm
    cluster: true
    # This is the VictoriaMetrics platform account. lazy-observe adds the
    # project_id label as the second isolation layer at its gateway.
    tenantAccountID: "42"
    queryURL: "http://vmselect.monitoring.svc:8481"
    ingestURL: "http://vminsert.monitoring.svc:8480"
  logs:
    # A vmauth/path-aware Service must route /insert/* to vlinsert and
    # /select/* to vlselect. AccountID and ProjectID headers are preserved.
    url: "http://vlogs-gateway.monitoring.svc:9428"
  traces:
    # A vmauth/path-aware Service must route /insert/* to vtinsert and
    # /select/* to vtselect. AccountID and ProjectID headers are preserved.
    url: "http://vtraces-gateway.monitoring.svc:10428"

hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 9
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Keep gateway replicas on different nodes when the cluster has capacity.
# Rendered with the release's selectorLabels (app.kubernetes.io/name + instance).
podAntiAffinity: soft

process:
  startupTimeout: 30s
  shutdownTimeout: 20s
  drainTimeout: 25s
  preStopDelay: 5s
terminationGracePeriodSeconds: 60
