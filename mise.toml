# lazy = true 需要 2026.9 起的 lazy 工具；2026.10.13 起任务里装别的工具时不丢 lazy 工具的 shim。
min_version = "2026.10.13"

# 工具版本只在这里写一次：任务不再写 tools.*，scripts/ci-setup-mise.sh 的 profile 与 ci.yml 的 `mise x` 只写工具名，
# 版本由 mise 从这里解析（Renovate 的 mise manager 只改这个文件）。
# lazy = true：裸 `mise install` 与 `mise run` 不会预装，只有 profile 按名字（`mise install uv`）或
# 任务/命令真正用到时才装，所以每个 CI job 仍然只装自己那份。
[tools]
go = "1.26.11"
node = "26.13.1"
pnpm = "12.20.0"
jq = "1.8.2"
actionlint = "1.7.12"
rg = "14.1.1"
air = "1.67.1"
"go:github.com/golangci/golines" = "0.15.0"
# uv：check-embedded-artifact.sh、check-release-smoke.sh、e2e-multi-replica.sh 与 sdk-python 任务的受管 Python（scripts/lib/uv-python.sh）。
uv = { version = "0.13.7", lazy = true }
golangci-lint = { version = "2.12.2", lazy = true }
helm = { version = "4.3.2", lazy = true }
goreleaser = { version = "2.17.0", lazy = true }
"go:github.com/google/go-licenses/v2" = { version = "2.0.1", lazy = true, lazy_bins = ["go-licenses"] }
# 版本按 7 天冷却挑选；go 后端经 go install 安装，模块校验和由 sum.golang.org 校验。
"go:golang.org/x/vuln/cmd/govulncheck" = { version = "1.10.0", lazy = true, lazy_bins = ["govulncheck"] }

[tasks.ent-generate]
description = "Regenerate the tracked Ent client in internal/db/ent from internal/db/schema"
run = "bash scripts/generate-ent.sh"

[tasks.dev-storage]
description = "Download and verify the current platform's development storage binaries"
run = '''
#!/usr/bin/env bash
set -euo pipefail

platform="$(go env GOOS)-$(go env GOARCH)"
LO_STORAGE_BIN_DIR="$PWD/.cache/storage-bin/$platform" \
  bash scripts/download-storage-bins.sh
'''

[tasks.dev-backend]
description = "Run the Go gateway and VM suite with Air live reload"
depends = ["dev-storage"]
run = "air -c .air.toml"

[tasks.dev-web]
description = "Run the Vite web UI with hot module replacement"
run = '''
#!/usr/bin/env bash
set -euo pipefail
cd web
pnpm install --frozen-lockfile
pnpm dev --host "${LO_DEV_WEB_HOST:-0.0.0.0}"
'''

[tasks.dev]
description = "Run the hot-reloading web UI, Go gateway, and VM suite"
run = "bash scripts/dev.sh"

[tasks.build-binary]
description = "Build the lazy-observe gateway"
run = '''
#!/usr/bin/env bash
set -euo pipefail

goos=${GOOS:-$(go env GOOS)}
goarch=${GOARCH:-$(go env GOARCH)}
binary=${BINARY:-bin/lazy-observe}
version=${VERSION:-dev}
commit=${COMMIT:-$(git rev-parse --short HEAD 2>/dev/null || printf none)}
date=${DATE:-unknown}
ldflags=${LDFLAGS:--s -w -X main.Version=$version -X main.Commit=$commit -X main.Date=$date}

mkdir -p "$(dirname "$binary")"
CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
  go build -trimpath -ldflags "$ldflags" -o "$binary" ./cmd/lazy-observe
'''

[tasks.web-assets]
description = "Build and stage the embedded web UI"
run = [
  "cd web && CI=true pnpm install --frozen-lockfile && pnpm build",
  "bash scripts/prepare-web-assets.sh",
]

[tasks.embedded-storage]
description = "Prepare embedded storage binaries for the selected platform"
run = '''
#!/usr/bin/env bash
set -euo pipefail
GOOS=${GOOS:-$(go env GOOS)} GOARCH=${GOARCH:-$(go env GOARCH)} \
  bash scripts/prepare-embedded-storage.sh
'''

[tasks.build]
description = "Build the web UI and gateway"
depends = ["web-assets"]
run = "mise run build-binary"

[tasks.dist]
description = "Build a release binary with embedded web and storage assets"
depends = ["web-assets", "embedded-storage"]
run = "mise run build-binary"

[tasks.dist-cross]
description = "Build release binaries for linux and amd64/arm64"
depends = ["web-assets"]
# check-embedded-artifact.sh 的内嵌校验用 uv 受管的 Python（scripts/lib/uv-python.sh），不用系统 python3。
run = '''
#!/usr/bin/env bash
set -euo pipefail

for platform in linux-amd64 linux-arm64; do
  goos=${platform%-*}
  goarch=${platform#*-}
  case "$goarch" in
    amd64)
      GOOS="$goos" GOARCH="$goarch" GOAMD64=v1 mise run embedded-storage
      GOOS="$goos" GOARCH="$goarch" GOAMD64=v1 BINARY="bin/lazy-observe-$platform" mise run build-binary
      LO_ARTIFACT_EVIDENCE=".cache/artifact-evidence/$platform.json" \
        bash scripts/check-embedded-artifact.sh "bin/lazy-observe-$platform" "$platform"
      ;;
    arm64)
      GOOS="$goos" GOARCH="$goarch" GOARM64=v8.0 mise run embedded-storage
      GOOS="$goos" GOARCH="$goarch" GOARM64=v8.0 BINARY="bin/lazy-observe-$platform" mise run build-binary
      LO_ARTIFACT_EVIDENCE=".cache/artifact-evidence/$platform.json" \
        bash scripts/check-embedded-artifact.sh "bin/lazy-observe-$platform" "$platform"
      ;;
  esac
done
'''

[tasks.test]
description = "Run Go tests without CGO"
run = "CGO_ENABLED=0 go test ./..."

[tasks.vet]
description = "Run go vet without CGO"
run = "CGO_ENABLED=0 go vet ./..."

[tasks.fmt-check]
description = "Verify tracked non-generated Go sources use the project golines format"
run = '''
#!/usr/bin/env bash
set -euo pipefail
unformatted=$(
  while IFS= read -r -d '' file; do
    [[ -f $file ]] || continue
    golines -m 120 --chain-split-dots --ignore-generated -l "$file"
  done < <(git ls-files -z -- '*.go')
)
if [[ -n $unformatted ]]; then
  printf 'golines -m 120 --chain-split-dots is required for:\n%s\n' "$unformatted" >&2
  exit 1
fi
'''

[tasks.mod-tidy-check]
description = "Verify root module manifest is tidy"
run = '''
#!/usr/bin/env bash
set -euo pipefail
CGO_ENABLED=0 go mod tidy -diff
'''

[tasks.lint]
description = "Run golangci-lint and the alert lease clock check"
depends = ["alert-lease-clock-check"]
# --allow-serial-runners: 并行 worktree 共用一份全局锁，拿不到锁时排队等待而不是以
# "parallel golangci-lint is running" 退出。只影响等锁行为，不影响检查结果。
run = "golangci-lint run --allow-serial-runners ./..."

[tasks.alert-lease-clock-check]
description = "Verify alert lease and membership queries read the clock through alertClockSQL"
run = "CGO_ENABLED=0 go run ./scripts/check-alert-lease-clock internal/meta"

[tasks.storage-bins]
description = "Download and verify pinned storage binaries"
run = '''
#!/usr/bin/env bash
set -euo pipefail
LO_STORAGE_BIN_DIR=${STORAGE_BIN_DIR:-$PWD/.cache/storage-bin} \
  bash scripts/download-storage-bins.sh
'''

[tasks.storage-bin-vulns]
description = "Trivy-scan the pinned Victoria binaries embedded in lazy-observe (linux amd64/arm64); fixable CRITICAL/HIGH fails"
run = "bash scripts/check-storage-bin-vulns.sh"

[tasks.e2e]
description = "Run complete server-side Gateway E2E coverage plus recovery and restart evidence"
depends = ["build", "storage-bins"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
BINARY=${BINARY:-bin/lazy-observe} \
STORAGE_BIN_DIR=${STORAGE_BIN_DIR:-$PWD/.cache/storage-bin} \
  bash scripts/e2e.sh
'''

[tasks.e2e-restart]
description = "Run same-data-dir graceful, forced, pending-work, and managed-child restart gates"
depends = ["build", "storage-bins"]
run = "bash scripts/e2e-restart.sh"

[tasks.e2e-contract-check]
description = "Statically verify E2E coverage and cross-platform delivery evidence"
run = "bash scripts/check-e2e-contract.sh"

[tasks.e2e-ha]
description = "Run the VM/VLogs/VTraces cluster and S3 multi-replica HA gate locally (Docker required); PR CI runs it for server code changes"
# e2e-multi-replica.sh 的内联辅助用 uv 受管的 Python（scripts/lib/uv-python.sh），不用系统 python3。
depends = ["build-binary", "storage-bins"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
binary=${BINARY:-bin/lazy-observe}
storage=${STORAGE_BIN_DIR:-$PWD/.cache/storage-bin}
case "$binary" in /*) binary_path=$binary ;; *) binary_path=$PWD/$binary ;; esac
case "$storage" in /*) storage_path=$storage ;; *) storage_path=$PWD/$storage ;; esac
LO_E2E_BINARY="$binary_path" LO_E2E_STORAGE_BIN_DIR="$storage_path" \
  bash scripts/e2e-multi-replica.sh
'''

[tasks.perf-ha]
description = "Run controlled query P95 and capacity-controlled weak-scaling gates in the real HA fixture"
depends = ["build-binary", "storage-bins"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
binary=${BINARY:-bin/lazy-observe}
storage=${STORAGE_BIN_DIR:-$PWD/.cache/storage-bin}
output=${LO_PERF_OUTPUT_DIR:-bench/results}
case "$binary" in /*) binary_path=$binary ;; *) binary_path=$PWD/$binary ;; esac
case "$storage" in /*) storage_path=$storage ;; *) storage_path=$PWD/$storage ;; esac
LO_E2E_PERF_GATES=1 LO_PERF_OUTPUT_DIR="$output" \
LO_E2E_BINARY="$binary_path" LO_E2E_STORAGE_BIN_DIR="$storage_path" \
  bash scripts/e2e-multi-replica.sh
'''

[tasks.helm-lint]
description = "Lint the Helm chart"
run = '${HELM:-helm} lint deploy/helm/lazy-observe'

[tasks.helm-template-test]
description = "Check the Helm chart keeps key material out of the environment and honours image.digest"
run = "bash scripts/helm-template-test.sh"

[tasks.workflow-check]
description = "Statically validate GitHub Actions workflows without a runner"
run = [
  "bash scripts/check-github-workflows.sh",
  "bash scripts/check-pipefail-pipelines.sh",
  "bash scripts/ci-setup-mise-test.sh",
  "bash scripts/check-e2e-contract.sh",
  "bash scripts/ci-changes-test.sh",
]

[tasks.ci-changes-test]
description = "Test that the CI change detector falls back to a full run for CI, toolchain, unclassified paths and missing base"
run = "bash scripts/ci-changes-test.sh"

[tasks.sdk-go]
description = "Verify the Go SDK nested module (sdk/go) is tidy, then build, vet, lint, and test it"
dir = "sdk/go"
env = { CGO_ENABLED = "0" }
run = [
  "go mod tidy -diff",
  "go build ./...",
  "go vet ./...",
  "golangci-lint run --allow-serial-runners ./...",
  "go test ./...",
]

[tasks.sdk-node]
description = "Install, build, typecheck, test, and license-check the Node SDK workspace (Node from LO_SDK_NODE_VERSION, default: [tools] node)"
# Node 版本由 mise 管理（mise exec node@<版本>），不用 actions/setup-node；CI 矩阵与本地用同一条命令：
#   LO_SDK_NODE_VERSION=22.23.5 mise run sdk-node
# 取值是 mise 的 node 版本请求（22.23.5、24、26.13.1 等）；不设就用 [tools] 里钉的那个。
run = '''
#!/usr/bin/env bash
set -euo pipefail
export CI=true
steps='node --version
cd sdk/node && pnpm install --frozen-lockfile && pnpm build && pnpm typecheck && pnpm test
cd ../.. && bash scripts/check-js-licenses.sh sdk/node'
if [[ -n ${LO_SDK_NODE_VERSION:-} ]]; then
  exec mise exec "node@$LO_SDK_NODE_VERSION" -- bash -ec "$steps"
fi
exec bash -ec "$steps"
'''

[tasks.sdk-browser]
description = "Install, build, typecheck, unit-test, and license-check the Browser SDK workspace (Node from LO_SDK_NODE_VERSION, default: [tools] node)"
# 完整套件只在 [tools] 钉的那个 Node 上跑；其它 Node 版本只跑 sdk-browser-smoke。参数化方式同 sdk-node。
# 先只装并构建 bundler-plugin 再整体 install，避免 examples/react 的 bin 指向还没构建的 dist/cli.js 报 "Failed to create bin"（同 sdk/browser/e2e.sh）。
run = '''
#!/usr/bin/env bash
set -euo pipefail
export CI=true
steps='node --version
cd sdk/browser && pnpm install --frozen-lockfile --filter @lazy-observe/bundler-plugin
pnpm --filter @lazy-observe/bundler-plugin build
pnpm install --frozen-lockfile && pnpm build && pnpm typecheck && pnpm test
cd ../.. && bash scripts/check-js-licenses.sh sdk/browser'
if [[ -n ${LO_SDK_NODE_VERSION:-} ]]; then
  exec mise exec "node@$LO_SDK_NODE_VERSION" -- bash -ec "$steps"
fi
exec bash -ec "$steps"
'''

[tasks.sdk-browser-smoke]
description = "Build @lazy-observe/bundler-plugin and run its load smoke (require/import of . and ./vite, bin --help) on LO_SDK_NODE_VERSION"
# bundler-plugin 只发 ESM，靠 Node 22.15+ 的 require(esm) 服务 CJS 调用方：每个受支持的 Node 主线都要验证一遍；
# 浏览器 SDK 其余测试与 Node 版本无关，只在 sdk-browser 里跑一次。
#   LO_SDK_NODE_VERSION=22.23.5 mise run sdk-browser-smoke
# 安装顺序同 sdk-browser：先装并构建 bundler-plugin，再整体 install（vitest 在工作区根的 devDependencies 里）。
run = '''
#!/usr/bin/env bash
set -euo pipefail
export CI=true
steps='node --version
cd sdk/browser && pnpm install --frozen-lockfile --filter @lazy-observe/bundler-plugin
pnpm --filter @lazy-observe/bundler-plugin build
pnpm install --frozen-lockfile
pnpm --filter @lazy-observe/bundler-plugin exec vitest run test/smoke.test.ts'
if [[ -n ${LO_SDK_NODE_VERSION:-} ]]; then
  exec mise exec "node@$LO_SDK_NODE_VERSION" -- bash -ec "$steps"
fi
exec bash -ec "$steps"
'''

[tasks.sdk-python]
description = "Create sdk/python/.venv with uv (interpreter from LO_SDK_PYTHON_VERSION, default 3.13), install the test extras and run pytest"
# 解释器由 uv 管理（uv python install），不用系统 Python，也不用 pip；CI 矩阵与本地用同一条命令：
#   LO_SDK_PYTHON_VERSION=3.15t mise run sdk-python
# 取值是 uv 的版本请求：3.9、3.13、3.15、3.15t（free-threaded）、3.16（预发布）等。
dir = "sdk/python"
run = '''
#!/usr/bin/env bash
set -euo pipefail
version=${LO_SDK_PYTHON_VERSION:-3.13}
uv python install --managed-python "$version"
uv venv --managed-python --python "$version" --clear .venv
uv pip install --quiet --python .venv/bin/python -e ".[test]"
.venv/bin/python -VV
.venv/bin/python -m pytest -q tests
'''

[tasks.sdk-python-release]
description = "Verify the sdk-python-v* tag and build the PyPI sdist + wheel with uv (reads SDK_TAG and optional PUBLISH_FLAG from the environment)"
# 发布路径与 sdk-python 一样只用 uv：不用 setup-python、系统 Python 与 pip；sdk/python/pyproject.toml 的
# [tool.uv] exclude-newer 同样约束 uv build 的构建后端（setuptools）解析。由 .github/workflows/sdk-release.yml 的 python job 调用，
# 本地 dry run：SDK_TAG=sdk-python-v0.1.0 mise run sdk-python-release
run = '''
#!/usr/bin/env bash
set -euo pipefail
# PUBLISH_FLAG 故意不加引号：为空就是 dry run。
bash sdk/scripts/sdk-publish.sh "${SDK_TAG:?SDK_TAG must be set, e.g. sdk-python-v0.1.0}" ${PUBLISH_FLAG:-}
'''

[tasks.sdk-journeys]
description = "Start a real platform (temp data dir, free ports) and run the Go, Node, Python, and Browser SDK journeys against it"
# build 带嵌入的前端（browser journey 要登录真实 UI）；sdk-python 准备 sdk/python/.venv。
depends = ["build", "storage-bins", "sdk-python"]
run = "bash scripts/sdk-journeys.sh"

