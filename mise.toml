description = "Validate installer platform, checksum, extraction, and mode contracts"
run = "bash scripts/check-install.sh"

[tasks.release-prerequisites-test]
description = "Test snapshot and publish prerequisite enforcement"
run = "bash scripts/check-release-prerequisites-test.sh"

[tasks.bench]
description = "Run the ingest benchmark and optional baseline gate"
depends = ["build-binary", "storage-bins"]
run = '''
#!/usr/bin/env bash
set -euo pipefail

binary=${BINARY:-bin/lazy-observe}
storage=${STORAGE_BIN_DIR:-$PWD/.cache/storage-bin}
args=()
if [[ -n ${BENCH_BASELINE:-} ]]; then
  args+=(--baseline "$BENCH_BASELINE")
fi
CGO_ENABLED=0 go run ./cmd/ingest-bench \
  --binary "$binary" --storage-bin-dir "$storage" \
  --duration "${BENCH_DURATION:-30s}" \
  --concurrency "${BENCH_CONCURRENCY:-4}" \
  --batch-size "${BENCH_BATCH_SIZE:-200}" \
  --output "${BENCH_OUTPUT:-bench/result.json}" \
  "${args[@]}"
'''

[tasks.gate-release-artifacts]
description = "Gate existing linux embedded binaries and smoke the native zero-config artifact"
# check-release-smoke.sh 的内嵌校验脚本用 uv 管理的固定版本 Python（scripts/lib/uv-python.sh，LO_SCRIPTS_PYTHON_VERSION 默认 3.13），不用系统 python3。
run = '''
#!/usr/bin/env bash
set -euo pipefail

output=${LO_PERF_OUTPUT_DIR:-bench/results}
mkdir -p "$output"
bash scripts/check-goreleaser-adapter.sh
for platform in linux-amd64 linux-arm64; do
  CGO_ENABLED=0 go run ./cmd/perf-gate release-size \
    --config bench/performance-gates.json \
    --binary "bin/lazy-observe-$platform" --platform "$platform" \
    --output "$output/release-$platform.json"
done
native="$(go env GOOS)-$(go env GOARCH)"
case "$native" in linux-amd64|linux-arm64) ;; *)
  printf 'SKIP: native zero-config smoke is unsupported on %s\n' "$native" >&2
  exit 77
esac
max_rss=$(jq -er '.release.max_idle_rss_bytes | select(type == "number" and . > 0 and floor == .)' bench/performance-gates.json)
LO_RELEASE_BINARY="bin/lazy-observe-$native" \
LO_RELEASE_MAX_RSS_BYTES="$max_rss" \
LO_RELEASE_SMOKE_OUTPUT="$output/release-smoke-$native.json" \
  bash scripts/check-release-smoke.sh
'''

[tasks.perf-release]
description = "Build and gate both embedded release binaries, then smoke the native zero-config artifact"
run = '''
#!/usr/bin/env bash
set -euo pipefail
mise run dist-cross
mise run gate-release-artifacts
'''

