version: "2"

linters:
  default: none
  enable:
    - bidichk
    - bodyclose
    - copyloopvar
    - depguard
    - durationcheck
    - errcheck
    - errorlint
    - fatcontext
    - forbidigo
    - govet
    - ineffassign
    - misspell
    - nilerr
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unused
  settings:
    # Fiber v3 calls that compile but changed meaning (patterns match the
    # type-qualified name, so fasthttp's c.Request().Body() is not caught).
    forbidigo:
      analyze-types: true
      forbid:
        # Ctx.Protocol is the HTTP version ("HTTP/1.1") in v3, never the scheme.
        - pattern: ^fiber\.(Ctx|Req)\.Protocol$
          pkg: ^github\.com/gofiber/fiber/v3$
          msg: Fiber v3 Protocol() is the HTTP version; use Scheme() for http/https
        # Ctx.Body decodes Content-Encoding again and returns error text for a
        # coding it cannot undo; scoped to the gateway by an exclusion below.
        - pattern: ^fiber\.(Ctx|Req)\.Body$
          pkg: ^github\.com/gofiber/fiber/v3$
          msg: gateway handlers read requestBody(c); Fiber v3 Body() re-decodes Content-Encoding
    depguard:
      rules:
        # ADR 0004: the generated Ent client and schema packages stay behind
        # the metadata persistence seam.
        ent-behind-metadata-seam:
          files:
            - $all
            - "!**/internal/meta/**"
            - "!**/internal/db/**"
            - "!$test"
          deny:
            - pkg: github.com/eimsound/lazy-observe/internal/db/ent
              desc: use internal/meta behavior; Ent stays behind the metadata seam (ADR 0004)
  exclusions:
    paths:
      # Generated Ent client code and gitignored throwaway PoC spikes.
      - ^internal/db/ent/
      - ^poc/
    rules:
      # The Body ban guards gateway handlers only; tests and other packages may
      # read the decoded body.
      - path-except: ^internal/gateway/
        text: requestBody\(c\)
        linters:
          - forbidigo
      - path: _test\.go
        text: requestBody\(c\)
        linters:
          - forbidigo
      # Existing tests intentionally use best-effort cleanup after assertions;
      # Fiber app.Test returns in-memory NopCloser bodies and test helpers that
      # return *http.Response own body cleanup via t.Cleanup/io.ReadAll.
      - path: _test\.go
        linters:
          - bodyclose
          - errcheck
      # Production cleanup and diagnostic writes are also best effort; primary
      # operation errors remain covered by errcheck.
      - text: Error return value of `.*(Close|Remove|Shutdown|Fprintf|Rollback)`
        linters:
          - errcheck
      # QF is a style-only staticcheck category.
      - text: QF1001
        linters:
          - staticcheck
