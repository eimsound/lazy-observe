# web 是单包工程；这个文件只用来放 pnpm 的工程级设置，packages 显式限定为本目录。
packages:
  - "."

# 供应链：解析依赖时只接受发布满 7 天的版本（单位分钟，7 × 1440；单一来源见 scripts/release-age.env，
# 与 renovate.json 的 minimumReleaseAge 一致，由 scripts/check-github-workflows.sh 校验）。
# 只影响重新解析（pnpm add/update、改 package.json 后的 install）；
# --frozen-lockfile 按锁文件安装，不做解析，已锁定的版本不受影响。
# 注意：它也会挡住发布不满 7 天的安全补丁。急需时在本文件加 minimumReleaseAgeExclude 放行具体的包，例如
#   minimumReleaseAgeExclude:
#     - some-package@1.2.3
# 放行要在 PR 里写明原因，修完后撤掉。
minimumReleaseAge: 10080
