[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "lazy-observe"
version = "0.1.0"
description = "lazy-observe Python SDK: explicit Django/DRF client instrumentation for the lazy-observe observability platform."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "lazy-observe" }]
keywords = ["observability", "django", "drf", "opentelemetry", "sentry"]
dependencies = [
    "opentelemetry-api>=1.30,<2.0",
    "opentelemetry-sdk>=1.30,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2.0",
    "httpx>=0.24,<1.0",
]

[project.optional-dependencies]
django = [
    "Django>=4.2",
    "djangorestframework>=3.14",
]
test = [
    "pytest>=8",
    "Django>=4.2",
    "djangorestframework>=3.14",
]

[tool.setuptools.packages.find]
include = ["lazy_observe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::pytest.PytestConfigWarning"]

[tool.uv]
# 最小发布年龄 7 天，与 scripts/release-age.env 的 MIN_RELEASE_AGE_DAYS、pnpm minimumReleaseAge 一致；
# uv 解析（uv pip install、uv build 的构建依赖）只取发布满 7 天的版本。
exclude-newer = "7 days"
